# Working on orrery: the repo with `nuxt dev`, so a saved change shows on the page straight away and
# the server reloads itself, with no rebuild. Run it as the playground (.playground/play), a compose project
# of its own with a demo database, so the branch you're on never touches the Orrerys you use.
# It's this machine's only, whatever ORRERY_HOST says: the dev server hands out the source and its
# build errors to whoever can reach it. The container has its own node_modules and .nuxt (volumes),
# so they don't clash with the host's; after a pnpm-lock.yaml change, `docker compose restart orrery`.
# Its database is the SQLite file in ORRERY_DATA, as the Rust API stays on SQLite until the Nuxt server is gone
# (decision-rust-api-storage). For Postgres, the postgres profile and ORRERY_DATABASE, as docker-compose.yml says.

services:
  orrery:
    build: {context: ., target: dev}
    ports: !override
      - "127.0.0.1:${ORRERY_PORT:-9000}:9000"
    environment:
      NUXT_LISTEN_HOST: 127.0.0.1
      # The Rust API says each request it answers, beside the server's `[orrery api-route]` lines for the ones it
      # didn't (ORR-1085), so `play logs` shows both sides.
      ORRERY_API_LOG: "1"
    volumes:
      - .:/src
      - orrery-node-modules:/src/node_modules
      - orrery-web-node-modules:/src/web/node_modules
      - orrery-nuxt:/src/web/.nuxt

volumes:
  orrery-node-modules:
  orrery-web-node-modules:
  orrery-nuxt:
