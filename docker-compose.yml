# Orrery, the built app, on http://localhost:9000 (or ORRERY_PORT): `docker compose up -d --build`.
#
# The database is made on the first start, in the orrery-data volume, so it outlasts the container.
# A copy goes to /backup a few seconds after each change, plus one a day for two weeks, and a new
# volume starts from that copy: the orrery-backup volume, or a folder of yours with ORRERY_BACKUP
# (one that syncs off the machine is best; the live file stays out of it, a synced SQLite file gets
# corrupted).
#
# The first time it's opened, it asks your name, and keeps it in the database: what you make, no one
# else can delete. Your `Orrery-Actor` header is it in lowercase snake case (`skoll_fenrisson`).
# ORRERY_ENVIRONMENT names this Orrery (`personal` by default; e.g. `work`): a chip by its name and
# the start of every tab's title. Each is its own server with its own database: another compose
# project with its own .env file, e.g. `docker compose --env-file .env.work up -d` with
# COMPOSE_PROJECT_NAME=orrery-work and its own ORRERY_PORT in it.
#
# ORRERY_DATA puts the database (orrery.db, with its -wal and -shm beside it) in a folder of yours instead
# of the orrery-data volume; on Linux it must be writable by uid 1000, the image's `node` user.
#
# Only this machine can reach it (there are no accounts): ORRERY_HOST=0.0.0.0 opens it to the network,
# and ORRERY_ALLOWED_HOSTS names any host name it's reached by besides localhost and an IP (see SECURITY.md).
#
# ORRERY_SECRET_KEY (a long random string: openssl rand -base64 32) turns on secrets, keys agents use to
# call outside services without seeing them; it encrypts them, so keep it out of the backups.
#
# Postgres instead of the SQLite file: `docker compose --profile postgres up -d` adds a postgres service (its
# data in the orrery-pg volume), and ORRERY_DATABASE points Orrery at it; put both in .env to keep them:
#   COMPOSE_PROFILES=postgres
#   ORRERY_DATABASE=postgres://orrery:orrery@postgres:5432/orrery
# Or set ORRERY_DATABASE to a Postgres of your own. Orrery backs Postgres up as a SQLite snapshot too; for a
# large one, or to restore into Postgres as it was, use its own means as well (pg_dump, a managed service's backups).
#
# ORRERY_BUILD_CONTEXT is what the image is built from: this folder by default, or a ref on GitHub, so a
# branch switched here never ends up in it: ORRERY_BUILD_CONTEXT=https://github.com/steffendybvik/orrery.git#main
#
# Working on Orrery itself: the playground (.playground/play), docker-compose.dev.yml on top of this.

services:
  orrery:
    build: {context: "${ORRERY_BUILD_CONTEXT:-.}", target: prod}
    ports:
      - "${ORRERY_HOST:-127.0.0.1}:${ORRERY_PORT:-9000}:9000"
    environment:
      NUXT_PUBLIC_ENVIRONMENT: ${ORRERY_ENVIRONMENT:-personal}
      NUXT_PUBLIC_REPO_DIR: ${PWD}
      NUXT_DATABASE: ${ORRERY_DATABASE:-/data/orrery.db}
      NUXT_BACKUP_DIR: /backup
      # What /data and /backup are on this computer, the same as the volumes below, for App settings to show.
      NUXT_DATA_HOST: ${ORRERY_DATA:-orrery-data}
      NUXT_BACKUP_HOST: ${ORRERY_BACKUP:-orrery-backup}
      NUXT_ALLOWED_HOSTS: ${ORRERY_ALLOWED_HOSTS:-}
      NUXT_SECRET_KEY: ${ORRERY_SECRET_KEY:-}
    volumes:
      - ${ORRERY_DATA:-orrery-data}:/data
      - ${ORRERY_BACKUP:-orrery-backup}:/backup
    depends_on:
      postgres: {condition: service_healthy, required: false}
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: orrery
      POSTGRES_PASSWORD: ${ORRERY_PG_PASSWORD:-orrery}
      POSTGRES_DB: orrery
    volumes:
      - orrery-pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orrery -d orrery]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  orrery-data:
  orrery-backup:
  orrery-pg:
