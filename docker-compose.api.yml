# The Rust API in a container of its own (ORR-1029, ORR-1051, ORR-1040), on top of docker-compose.yml (or the
# playground's docker-compose.dev.yml): the Dockerfile's rust-api, on the same SQLite file in /data. Without this file
# the image runs the API inside its one container (ORR-1041). The Nuxt server routes its domains to it
# (web/server/utils/api-router.ts) and follows its outbox, with the swap's flag on (NUXT_API_ONLY, ORR-1034): with it
# down a request for them fails (503, said in the log), as their routes in Nuxt are gone.
#
# The playground: .playground/play always adds this file, and makes the token both containers share (ORRERY_API_TOKEN,
# kept in .playground/data/api-token).
#
# An orrery of yours: two lines in its .env (or .env.work), then `docker compose up -d --build`, which builds the API
# from ORRERY_BUILD_CONTEXT as it does the app:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.api.yml
#   ORRERY_API_TOKEN=<openssl rand -hex 32>
# The way back is those two lines out and `docker compose up -d --remove-orphans`: the image's own API then serves the
# same file. The API doesn't migrate the database (the Nuxt server still does).
#
# The API publishes no port: it's reached on the compose network only, through the Nuxt server, which makes its checks
# (the login, a browser write's Origin, a session's person) before it forwards a request. A database move or a restore
# in App settings leaves this container on the old file, so routed requests answer 503 until `docker compose restart api`.

services:
  orrery:
    environment:
      NUXT_API_URL: http://api:9100
      NUXT_API_TOKEN: ${ORRERY_API_TOKEN:-}
      NUXT_API_ONLY: "1"
      # The image's own copy, which it starts beside itself without this file (ORR-1041), isn't started: this one is.
      NUXT_API_BIN: ""
    depends_on:
      api: {condition: service_started}

  api:
    build: {context: "${ORRERY_BUILD_CONTEXT:-.}", target: rust-api}
    environment:
      NUXT_API_TOKEN: ${ORRERY_API_TOKEN:-}
      NUXT_DATABASE: ${ORRERY_DATABASE:-/data/orrery.db}
      NUXT_ALLOWED_ORIGINS: ${ORRERY_ALLOWED_ORIGINS:-}
      NUXT_OIDC_ISSUER: ${ORRERY_OIDC_ISSUER:-}
      NUXT_OIDC_CLIENT_ID: ${ORRERY_OIDC_CLIENT_ID:-}
      NUXT_OIDC_CLIENT_SECRET: ${ORRERY_OIDC_CLIENT_SECRET:-}
    volumes:
      - ${ORRERY_DATA:-orrery-data}:/data
    init: true
    # Its graceful shutdown listens for Ctrl-C.
    stop_signal: SIGINT
    restart: unless-stopped
