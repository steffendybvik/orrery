# orrery __VERSION__, the published image, on http://localhost:9000 (or ORRERY_PORT): `docker compose up -d`.
#
# `name: orrery` keeps the volumes' names the same whatever this folder is called (orrery_orrery-data): renaming or
# moving the folder never starts a new, empty database. A second orrery on this machine sets COMPOSE_PROJECT_NAME
# (e.g. orrery-work) in its own env file, which gives it volumes of its own.
#
# The database is made on the first start, in the orrery-data volume, so it outlasts the container. A copy goes to
# the orrery-backup volume a few seconds after each change, plus one a day for two weeks, each checked before it's
# kept. That volume is on this computer: set ORRERY_BACKUP to a folder that leaves it (iCloud Drive, Dropbox, one Time
# Machine covers). On Linux, make that folder first: orrery runs as uid 1000, and a folder Docker makes is root's.
# Never `docker compose down -v`: it deletes the database and the backups. See README.md.
#
# Every setting is optional: see .env.example. To update, change the version in `image:` below, then
# `docker compose pull && docker compose up -d`; orrery takes a copy before it upgrades the database.
name: orrery

services:
  orrery:
    image: ghcr.io/steffendybvik/orrery:__VERSION__
    ports:
      - "${ORRERY_HOST:-127.0.0.1}:${ORRERY_PORT:-9000}:9000"
    environment:
      NUXT_PUBLIC_ENVIRONMENT: ${ORRERY_ENVIRONMENT:-personal}
      NUXT_PUBLIC_REPO_DIR: ${PWD}
      NUXT_DATABASE: ${ORRERY_DATABASE:-/data/orrery.db}
      NUXT_BACKUP_DIR: /backup
      NUXT_BACKUP_DATABASE: ${ORRERY_BACKUP_DATABASE:-}
      # What /data and /backup are on this computer, the same as the volumes below, for App settings to show.
      NUXT_DATA_HOST: ${ORRERY_DATA:-orrery-data}
      NUXT_BACKUP_HOST: ${ORRERY_BACKUP:-orrery-backup}
      # Set when ORRERY_BACKUP names a folder: without one, App settings says the backups stay on this computer.
      NUXT_BACKUP_CHOSEN: ${ORRERY_BACKUP:+yes}
      NUXT_ALLOWED_HOSTS: ${ORRERY_ALLOWED_HOSTS:-}
      NUXT_LISTEN_HOST: ${ORRERY_HOST:-127.0.0.1}
      NUXT_SECRET_KEY: ${ORRERY_SECRET_KEY:-}
      NUXT_UPDATE_CHECK: ${ORRERY_UPDATE_CHECK:-true}
    volumes:
      - ${ORRERY_DATA:-orrery-data}:/data
      - ${ORRERY_BACKUP:-orrery-backup}:/backup
    depends_on:
      postgres: {condition: service_healthy, required: false}
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: orrery
      POSTGRES_PASSWORD: ${ORRERY_PG_PASSWORD:-orrery}
      POSTGRES_DB: orrery
    volumes:
      - orrery-pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orrery -d orrery]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  orrery-data:
  orrery-backup:
  orrery-pg:
