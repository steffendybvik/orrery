# orrery __VERSION__, the published image, on http://localhost:9000 (or ORRERY_PORT): `docker compose up -d`.
#
# `name: orrery` keeps the volumes' names the same whatever this folder is called (orrery_orrery-data): renaming or
# moving the folder never starts a new, empty database. A second orrery on this machine sets COMPOSE_PROJECT_NAME
# (e.g. orrery-work) in its own env file, which gives it volumes of its own.
#
# The database is made on the first start, in the orrery-data volume, so it outlasts the container. orrery takes no
# backups: backing the database up is up to you (see README.md). Never `docker compose down -v`: it deletes the database.
#
# Every setting is optional: see .env.example. To update, change the version in `image:` below, then
# `docker compose pull && docker compose up -d`, after backing the database up yourself.
name: orrery

services:
  orrery:
    image: ghcr.io/steffendybvik/orrery:__VERSION__
    ports:
      - "${ORRERY_HOST:-127.0.0.1}:${ORRERY_PORT:-9000}:9000"
      # The phone's own port (ORR-837): always asks for a login, so a phone on the network signs in with App settings'
      # QR code while the address above stays trusted for the sessions. 1 before ORRERY_PORT (19000) unless set.
      - "${ORRERY_PHONE_HOST:-0.0.0.0}:${ORRERY_PHONE_PORT:-1${ORRERY_PORT:-9000}}:9001"
    environment:
      NUXT_PUBLIC_ENVIRONMENT: ${ORRERY_ENVIRONMENT:-personal}
      NUXT_PUBLIC_REPO_DIR: ${ORRERY_REPO_DIR:-${PWD}}
      NUXT_DATABASE: ${ORRERY_DATABASE:-/data/orrery.db}
      # What /data is on this computer, the same as the volume below.
      NUXT_DATA_HOST: ${ORRERY_DATA:-orrery-data}
      NUXT_ALLOWED_HOSTS: ${ORRERY_ALLOWED_HOSTS:-}
      NUXT_ALLOWED_ORIGINS: ${ORRERY_ALLOWED_ORIGINS:-}
      NUXT_PAGES: ${ORRERY_PAGES:-}
      NUXT_USAGE: ${ORRERY_USAGE:-}
      NUXT_LISTEN_HOST: ${ORRERY_HOST:-127.0.0.1}
      NUXT_PHONE_URL: ${ORRERY_PHONE_URL:-}
      NUXT_PHONE_LISTEN: 9001
      NUXT_PHONE_PORT: ${ORRERY_PHONE_PORT:-1${ORRERY_PORT:-9000}}
      NUXT_PHONE_HOST: ${ORRERY_PHONE_HOST:-0.0.0.0}
      NUXT_SECRET_KEY: ${ORRERY_SECRET_KEY:-}
      NUXT_AUTH: ${ORRERY_AUTH:-}
      NUXT_OIDC_ISSUER: ${ORRERY_OIDC_ISSUER:-}
      NUXT_OIDC_CLIENT_ID: ${ORRERY_OIDC_CLIENT_ID:-}
      NUXT_OIDC_CLIENT_SECRET: ${ORRERY_OIDC_CLIENT_SECRET:-}
      NUXT_UPDATE_CHECK: ${ORRERY_UPDATE_CHECK:-true}
    volumes:
      - ${ORRERY_DATA:-orrery-data}:/data
    depends_on:
      postgres: {condition: service_healthy, required: false}
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: orrery
      POSTGRES_PASSWORD: ${ORRERY_PG_PASSWORD:-orrery}
      POSTGRES_DB: orrery
    volumes:
      - orrery-pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orrery -d orrery]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  orrery-data:
  orrery-pg:
