# Tests, typecheck and the production image, on every push and pull request; also the gate a release
# tag has to pass before `release.yml` publishes anything. The e2e flows run on a release tag and when a
# pull request goes from draft to ready for review.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    # The default three, and a draft becoming ready, which runs the e2e flows too.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Coverage summary
        run: |
          node >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          const {total} = require('./web/coverage/coverage-summary.json')
          const row = k => `| ${k} | ${total[k].pct}% | ${total[k].covered} / ${total[k].total} |`
          console.log(['### Coverage (server/utils, shared)', '', '| | % | covered |', '|---|---|---|',
            ...['lines', 'statements', 'functions', 'branches'].map(row)].join('\n'))
          EOF
      # The store's tests again, on Postgres.
      - run: pnpm --dir web exec vitest run test/store.test.ts test/schedules.test.ts test/connect.test.ts
        env:
          TEST_POSTGRES_URL: postgres://orrery:orrery@localhost:5432/orrery
      - run: pnpm typecheck

  # The main flows in a real browser, against `nuxt dev` with a fresh database: before a release, on
  # its tag, and on a pull request as it leaves draft. Other pushes and pull request updates run the
  # unit tests alone.
  e2e:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.action == 'ready_for_review' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser is cached per Playwright version; the system libraries it needs aren't, so a hit
      # still installs those.
      - id: playwright
        run: echo "version=$(pnpm --dir web exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --dir web exec playwright install-deps chromium
      - run: pnpm test:e2e
      # The report carries the traces of the failed tests (open with `pnpm exec playwright show-report`).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # A release builds the image itself, for both platforms.
  docker:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
