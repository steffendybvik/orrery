# Tests, typecheck and the production image, on every push and pull request; also the gate a release
# tag has to pass before `release.yml` publishes anything. The e2e flows run on every pull request that
# isn't a draft (so before it merges), on a release tag, and by hand (Run workflow).
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    # The default three, and a draft becoming ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Coverage summary
        run: |
          node >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          const {total} = require('./web/coverage/coverage-summary.json')
          const row = k => `| ${k} | ${total[k].pct}% | ${total[k].covered} / ${total[k].total} |`
          console.log(['### Coverage (server/utils, shared)', '', '| | % | covered |', '|---|---|---|',
            ...['lines', 'statements', 'functions', 'branches'].map(row)].join('\n'))
          EOF
      # The store's tests again, on Postgres.
      - run: pnpm --dir web exec vitest run test/store.test.ts test/schedules.test.ts test/connect.test.ts
        env:
          TEST_POSTGRES_URL: postgres://orrery:orrery@localhost:5432/orrery
      - run: pnpm typecheck
      - run: pnpm lint

  # The main flows in a real browser, against `nuxt dev` with a fresh database: on every pull request
  # that isn't a draft, each push to it included, so nothing merges without them; on a release tag; and
  # by hand. Pushes to a branch with no pull request run the unit tests alone.
  # The Playwright version web/ pins, for the e2e job's image.
  playwright:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: web/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' web/package.json)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image has the browser and the system libraries it needs. Installing those with apt on
    # every run took from 10 seconds to 11 minutes, as Ubuntu's mirror allowed.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      # The report carries the traces of the failed tests (open with `pnpm exec playwright show-report`).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # A release builds the image itself, for both platforms.
  docker:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
