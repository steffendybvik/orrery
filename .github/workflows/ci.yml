# Tests, typecheck and the production image, on every push and pull request; also the gate a release
# tag has to pass before `release.yml` publishes anything. The e2e flows and the performance run, on SQLite and on Postgres,
# run on a pull request into `main` that isn't a draft, on a release tag, and by hand (Run workflow); any other pull request runs the unit tests alone.
# The flows also run on Safari's engine and Firefox then, on SQLite. Every job runs with the Rust API in front, as it's
# no longer opt-in (ORR-1091).
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    # The default three, and a draft becoming ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # A release pull request has its changelog section, as its tag won't publish without one (ORR-742).
      - if: ${{ github.base_ref == 'main' && !github.event.pull_request.draft }}
        run: node web/scripts/changelog-section.mjs "$(jq -r .version web/package.json)" > /dev/null
      - run: pnpm install --frozen-lockfile
      # Every test on SQLite, then every unit test again on Postgres: the store's, the schema parity and upgrades, the
      # moves and backups into it. Each keeps its coverage, and the two are counted together, so code only the Postgres
      # run reaches (backing up into Postgres, moving to it) counts as tested (ORR-585).
      # The channel, launcher and hook that tests spawn count too: Vitest can't see into those processes (ORR-745).
      - run: pnpm --dir web exec vitest run --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/sqlite.json --reporter=json --outputFile.json=vitest-results.json
        env:
          ORRERY_SPAWN_COVERAGE: ${{ github.workspace }}/.v8-spawned
      - run: pnpm --dir web exec vitest run --project unit --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/postgres.json
        env:
          TEST_POSTGRES_URL: postgres://orrery:orrery@localhost:5432/orrery
      - run: pnpm --dir web exec vitest --merge-reports=.vitest-reports --coverage --reporter=dot
      - run: node web/scripts/coverage-lines.mjs --v8 .v8-spawned --out web/spawned-lines.json
        continue-on-error: true
      # The total, then each area on its own, so one no test runs (the routes, say) shows rather than hiding in the total (ORR-584).
      - name: Coverage summary
        run: |
          node >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          const summary = require('./web/coverage/coverage-summary.json')
          const AREAS = [['server/api', /\/web\/server\/api\//], ['server/middleware', /\/web\/server\/middleware\//], ['server/utils', /\/web\/server\/utils\//],
            ['server/store', /\/web\/server\/store\//], ['shared', /\/web\/shared\//], ['app', /\/web\/app\//], ['channel', /\/channel\/[^/]+\.mjs$/]]
          const files = Object.entries(summary).filter(([file]) => file !== 'total').map(([file, f]) => ({...f, area: AREAS.find(([, path]) => path.test(file))?.[0]}))
          const pct = ([covered, total]) => total ? `${(100 * covered / total).toFixed(1)}%` : '–'
          const rows = AREAS.map(([area]) => {
            const ours = files.filter(f => f.area === area)
            const sum = k => ours.reduce(([c, t], f) => [c + f[k].covered, t + f[k].total], [0, 0])
            return `| ${area} | ${ours.length} | ${ours.filter(f => f.lines.total && !f.lines.covered).length} | ${pct(sum('lines'))} | ${pct(sum('branches'))} |`
          })
          const {total} = summary
          console.log(['### Coverage', '', `Lines ${total.lines.pct}%, branches ${total.branches.pct}%, functions ${total.functions.pct}%.`, '',
            '| Area | Files | Run by no test | Lines | Branches |', '|---|---|---|---|---|', ...rows].join('\n'))
          EOF
      # What `pnpm test:report` reads at ship time (Releasing, ORR-678), with the e2e job's.
      - uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: |
            web/vitest-results.json
            web/coverage/coverage-summary.json
            web/coverage/coverage-final.json
            web/spawned-lines.json
          retention-days: 30
      - run: pnpm typecheck
      - run: pnpm lint

  # The Rust API (ORR-922, api/): its format, lints and own tests, then the store's parity with it on SQLite and on
  # Postgres (web/test/api-parity.test.ts), and its migrations against Node's (web/test/rust-migrations.test.ts): what the
  # check job skips, having no binary. The runner has Rust already.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check
        working-directory: api
      - run: cargo clippy --locked -- -D warnings
        working-directory: api
      # Its own tests, with their coverage (ORR-1053): the floor is what `cargo test` alone covers of the code itself, the
      # test files left out and without the parity tests below, and it only goes up (92.75% on 7 Nov 2026). Raise it as
      # tests are added: the same command in api/ says where it stands.
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --summary-only --ignore-filename-regex '(testing|_tests)\.rs$' --fail-under-lines 92
        working-directory: api
      # The same tests again on Postgres, each in a schema of its own (ORR-1057), so db.rs's Postgres side runs too.
      - run: cargo test --locked
        working-directory: api
        env:
          TEST_POSTGRES_URL: postgres://orrery:orrery@localhost:5432/orrery
      - run: cargo build --locked
        working-directory: api
      # The binary the browser suites and the perf run start the server with, when they run.
      - uses: actions/upload-artifact@v7
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && !github.event.pull_request.draft) }}
        with:
          name: orrery-api
          path: api/target/debug/orrery-api
          retention-days: 1
      - run: pnpm --dir web exec vitest run --project unit test/api-parity.test.ts test/rust-migrations.test.ts
      - run: pnpm --dir web exec vitest run --project unit test/api-parity.test.ts test/rust-migrations.test.ts
        env:
          TEST_POSTGRES_URL: postgres://orrery:orrery@localhost:5432/orrery

  # The main flows in a real browser, against `nuxt dev` with a fresh database: on a pull request into `main`
  # that isn't a draft, each push to it included, as they take too long for every pull request (ORR-749); on a
  # release tag; and by hand. Drafts, pull requests into a release branch, and pushes, run the unit tests alone.
  # The Playwright version web/ pins, for the e2e job's image.
  playwright:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: web/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' web/package.json)" >> "$GITHUB_OUTPUT"

  # Once on SQLite and once on Postgres: the service only starts for the Postgres run (no image, no service). Each in
  # three shards side by side, each its own server and database with a share of the specs (web/e2e-shards.ts, ORR-920):
  # whole, a suite took 15 to 25 minutes, and a flaky one run again took a release past 40.
  e2e:
    # The Rust API serves the board's data, its Nuxt routes gone (ORR-1041), so the server starts the api job's binary.
    needs: [playwright, api]
    runs-on: ubuntu-latest
    # A shard takes under ten minutes; this leaves room for Firefox and WebKit with retries (ORR-912).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
        browser: [chromium]
        shard: [1, 2, 3]
        include:
          - {database: sqlite, browser: webkit, shard: 1}
          - {database: sqlite, browser: webkit, shard: 2}
          - {database: sqlite, browser: webkit, shard: 3}
          - {database: sqlite, browser: firefox, shard: 1}
          - {database: sqlite, browser: firefox, shard: 2}
          - {database: sqlite, browser: firefox, shard: 3}
    # Playwright's own image has the browser and the system libraries it needs. Installing those with apt on
    # every run took from 10 seconds to 11 minutes, as Ubuntu's mirror allowed.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery_e2e
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The job runs in a container, so the service is reached by its name.
      E2E_POSTGRES_URL: ${{ matrix.database == 'postgres' && 'postgres://orrery:orrery@postgres:5432/orrery_e2e' || '' }}
      E2E_BROWSER: ${{ matrix.browser }}
      E2E_SHARD: ${{ matrix.shard }}/3
      NUXT_API_BIN: ${{ github.workspace }}/.api/orrery-api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orrery-api
          path: .api
      # An artifact doesn't keep the file's mode.
      - run: chmod +x .api/orrery-api
      # What the server behind the suite reached counts as covered (ORR-745), and what the page ran (ORR-784).
      - run: pnpm test:e2e
        env:
          # The image runs as root, and Firefox won't start with a home folder that's another user's.
          HOME: /root
          NODE_V8_COVERAGE: ${{ matrix.database == 'sqlite' && matrix.browser == 'chromium' && format('{0}/.v8-e2e', github.workspace) || '' }}
          # What the page's own code ran in Chrome (ORR-784) is off for now: with it, pages took past 5s to load early in the
          # run, so specs failed from the first minute and the job ran out of time (ORR-912). `pnpm test:e2e` with
          # E2E_PAGE_COVERAGE set still collects it.
          E2E_PAGE_COVERAGE: ''
      - run: node web/scripts/coverage-lines.mjs --v8 .v8-e2e --pages .page-e2e --out web/e2e-lines.json
        if: ${{ !cancelled() && matrix.database == 'sqlite' && matrix.browser == 'chromium' }}
        continue-on-error: true
      - run: pnpm test:e2e:login
        if: matrix.database == 'sqlite' && matrix.browser == 'chromium' && matrix.shard == 1
      # This shard's results and lines, which e2e-report puts together with the other shards'; a failed shard's too.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.database == 'sqlite' && matrix.browser == 'chromium' }}
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            web/blob-report/
            web/e2e-lines.json
          retention-days: 1
      # The report carries the traces of the failed tests (open with `pnpm exec playwright show-report`), a job that ran
      # out of time too, as that's when they're most needed (ORR-912).
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: playwright-report-${{ matrix.database }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7

  # The SQLite and Chrome shards' results and lines as one run, as the suite gave them whole: what `pnpm test:report`
  # reads at ship time (Releasing, ORR-678), under the same artifact name.
  e2e-report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-shard-*
          path: shards
      - run: |
          mkdir -p blobs lines
          for shard in shards/*/; do
            name=$(basename "$shard")
            cp "$shard"blob-report/*.zip blobs/ 2>/dev/null || true
            [ -f "$shard"e2e-lines.json ] && cp "$shard"e2e-lines.json "lines/$name.json"
          done
          ls blobs lines
          # A shard missing would leave its tests out of the numbers without a word.
          [ "$(ls blobs | wc -l)" -eq 3 ] || { echo "Expected 3 shards' blobs, found $(ls blobs | wc -l)"; exit 1; }
      - run: pnpm exec playwright merge-reports --reporter json ../blobs
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
      - run: node web/scripts/coverage-lines.mjs --pages lines --out web/e2e-lines.json
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e
          path: |
            web/e2e-results.json
            web/e2e-lines.json
          retention-days: 30

  # How fast the pages are on a big orrery (web/e2e/perf), run when the e2e flows are. A page over its budget fails
  # it. The report (each page's time, its API calls and their sizes) is kept every run, passed or not.
  perf:
    needs: [playwright, api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery_e2e
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_POSTGRES_URL: ${{ matrix.database == 'postgres' && 'postgres://orrery:orrery@postgres:5432/orrery_e2e' || '' }}
      NUXT_API_BIN: ${{ github.workspace }}/.api/orrery-api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orrery-api
          path: .api
      # An artifact doesn't keep the file's mode.
      - run: chmod +x .api/orrery-api
      - run: pnpm test:e2e:perf
      - run: cat perf-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
        if: always()
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report-${{ matrix.database }}
          path: |
            web/perf-report/
            web/playwright-report/
          retention-days: 30

  # A release builds the image itself, for both platforms.
  docker:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
