# Tests, typecheck and the production image, on every push and pull request; also the gate a release
# tag has to pass before `release.yml` publishes anything. The e2e flows in Chrome on SQLite, and the performance run on SQLite
# and on Postgres, and the restart suite on SQLite, run on a pull request into `main` that isn't a draft, on a release tag, and by hand (Run workflow); any
# other pull request runs the unit tests alone. Safari's engine and Firefox run a smaller set of the flows then (ORR-1269). Every job runs with the Rust API in front, as it's
# no longer opt-in (ORR-1091).
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    # The default three, and a draft becoming ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # A release pull request has its changelog section, as its tag won't publish without one (ORR-742).
      - if: ${{ github.base_ref == 'main' && !github.event.pull_request.draft }}
        run: node web/scripts/changelog-section.mjs "$(jq -r .version web/package.json)" > /dev/null
      - run: pnpm install --frozen-lockfile
      # The Rust API that a unit test of what goes through it starts on its own database (web/test/api.ts, ORR-1163).
      # The runner has Rust already; the global setup's own `cargo build` then finds it built.
      - run: cargo build --locked
        working-directory: api
      # Every test on SQLite, then every unit test again on Postgres: the store's, the schema parity and upgrades, and
      # copies into it. Each keeps its coverage, and the two are counted together, so code only the Postgres run reaches
      # counts as tested (ORR-585).
      # The channel, launcher and hook that tests spawn count too: Vitest can't see into those processes (ORR-745).
      - run: pnpm --dir web exec vitest run --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/sqlite.json --reporter=json --outputFile.json=vitest-results.json
        env:
          ORRERY_SPAWN_COVERAGE: ${{ github.workspace }}/.v8-spawned
      - run: pnpm --dir web exec vitest run --project unit --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/postgres.json
        env:
          TEST_POSTGRES_URL: postgres://orrery:orrery@localhost:5432/orrery
      - run: node web/scripts/coverage-lines.mjs --v8 .v8-spawned --out web/spawned-lines.json
        continue-on-error: true
      # Counted with the api job's in the coverage job below.
      - uses: actions/upload-artifact@v7
        with:
          name: unit-reports-check
          path: |
            web/.vitest-reports/
            web/vitest-results.json
            web/spawned-lines.json
          include-hidden-files: true
          retention-days: 1
      - run: pnpm typecheck
      - run: pnpm lint

  # The dependencies against the advisory databases (ORR-1361): the API's crates (`cargo audit`, RustSec) and the
  # app's production packages (`pnpm audit`, high and critical), so a new advisory fails a pull request rather than
  # waiting for someone to run them by hand. An advisory that can't be reached is ignored by its id, with why, in
  # api/.cargo/audit.toml; none is today. Warnings (unmaintained crates) are reported and don't fail it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: api
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm audit --prod --audit-level high

  # The Rust API (ORR-922, api/): its format, lints and own tests, then the store's parity with it on SQLite and on
  # Postgres (web/test/api-parity.test.ts), and its migrations against Node's (web/test/rust-migrations.test.ts): what the
  # check job leaves to it. The runner has Rust already.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check
        working-directory: api
      - run: cargo clippy --locked -- -D warnings
        working-directory: api
      # Its own tests, with their coverage (ORR-1053): on SQLite, then again on Postgres, each in a schema of its own
      # (ORR-1057), so the Postgres side of db.rs and migrate.rs counts too (ORR-1128). The floor is what the two cover of
      # the code itself, the test files left out and without the parity tests below, and it only goes up (95.25% on
      # 12 Nov 2026, 95.6% on 22 Nov). Raise it as tests are added: the same three commands in api/ say where it stands.
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --locked --no-report
        working-directory: api
      - run: cargo llvm-cov --locked --no-report
        working-directory: api
        env:
          TEST_POSTGRES_URL: postgres://orrery:orrery@localhost:5432/orrery
      - run: cargo llvm-cov report --summary-only --ignore-filename-regex '(testing|_tests)\.rs$' --fail-under-lines 95.6
        working-directory: api
      # Every session, signal and chat file is held at 100% of its lines (ORR-1324): llvm-cov's floor is for the whole
      # report, so this reads each file's own figure from its JSON.
      - name: Session, signal and chat files at 100% of lines
        working-directory: api
        run: |
          cargo llvm-cov report --json --summary-only --ignore-filename-regex '(testing|_tests)\.rs$' --output-path target/session-coverage.json
          python3 - <<'PY'
          import json, re
          held = re.compile(r'src/(access|routes|work|mcp)/(chats|sessions|session_[a-z_]+|signals|presence)\.rs$')
          files = [f for f in json.load(open('target/session-coverage.json'))['data'][0]['files'] if held.search(f['filename'])]
          short = [(f['filename'].split('src/')[-1], f['summary']['lines']) for f in files if f['summary']['lines']['covered'] < f['summary']['lines']['count']]
          print(f"{len(files)} session, signal and chat files")
          for name, lines in short:
              print(f"::error file=api/src/{name}::{lines['count'] - lines['covered']} of {lines['count']} lines aren't covered")
          if not files or short:
              raise SystemExit(1)
          PY
      - run: cargo build --locked
        working-directory: api
      # The binary the browser suites and the perf run start the server with, when they run.
      - uses: actions/upload-artifact@v7
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && !github.event.pull_request.draft) }}
        with:
          name: orrery-api
          path: api/target/debug/orrery-api
          retention-days: 1
      # And a door's refusals, the router's middleware against the API's guard (ORR-1113), on SQLite alone: the doors
      # are the same whatever the database.
      # Each with its coverage, which the coverage job counts with the check job's: the router's relay of what a Rust
      # write sets off runs only here (ORR-1123).
      - run: pnpm --dir web exec vitest run --project unit --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/api-sqlite.json test/api-parity.test.ts test/rust-migrations.test.ts test/door-refusals.test.ts
      - run: pnpm --dir web exec vitest run --project unit --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/api-postgres.json test/api-parity.test.ts test/rust-migrations.test.ts
        env:
          TEST_POSTGRES_URL: postgres://orrery:orrery@localhost:5432/orrery
      - uses: actions/upload-artifact@v7
        with:
          name: unit-reports-api
          path: web/.vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # The unit coverage: the check job's runs and the api job's, counted together.
  coverage:
    needs: [check, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: unit-reports-check
          path: web
      - uses: actions/download-artifact@v8
        with:
          name: unit-reports-api
          path: web/.vitest-reports
      - run: ls web/.vitest-reports
      - run: pnpm --dir web exec vitest --merge-reports=.vitest-reports --coverage --reporter=dot
      # The total, then each area on its own, so one no test runs (the routes, say) shows rather than hiding in the total (ORR-584).
      - name: Coverage summary
        run: |
          node >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          const summary = require('./web/coverage/coverage-summary.json')
          const AREAS = [['server/api', /\/web\/server\/api\//], ['server/middleware', /\/web\/server\/middleware\//], ['server/utils', /\/web\/server\/utils\//],
            ['server/store', /\/web\/server\/store\//], ['shared', /\/web\/shared\//], ['app', /\/web\/app\//], ['channel', /\/channel\/[^/]+\.mjs$/]]
          const files = Object.entries(summary).filter(([file]) => file !== 'total').map(([file, f]) => ({...f, area: AREAS.find(([, path]) => path.test(file))?.[0]}))
          const pct = ([covered, total]) => total ? `${(100 * covered / total).toFixed(1)}%` : '–'
          const rows = AREAS.map(([area]) => {
            const ours = files.filter(f => f.area === area)
            const sum = k => ours.reduce(([c, t], f) => [c + f[k].covered, t + f[k].total], [0, 0])
            return `| ${area} | ${ours.length} | ${ours.filter(f => f.lines.total && !f.lines.covered).length} | ${pct(sum('lines'))} | ${pct(sum('branches'))} |`
          })
          const {total} = summary
          console.log(['### Coverage', '', `Lines ${total.lines.pct}%, branches ${total.branches.pct}%, functions ${total.functions.pct}%.`, '',
            '| Area | Files | Run by no test | Lines | Branches |', '|---|---|---|---|---|', ...rows].join('\n'))
          EOF
      # What `pnpm test:report` reads at ship time (Releasing, ORR-678), with the e2e job's.
      - uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: |
            web/vitest-results.json
            web/coverage/coverage-summary.json
            web/coverage/coverage-final.json
            web/spawned-lines.json
          retention-days: 30

  # The main flows in a real browser, against `nuxt dev` with a fresh database: on a pull request into `main`
  # that isn't a draft, each push to it included, as they take too long for every pull request (ORR-749); on a
  # release tag; and by hand. Drafts, pull requests into a release branch, and pushes, run the unit tests alone.
  # The Playwright version web/ pins, for the e2e job's image.
  playwright:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: web/package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' web/package.json)" >> "$GITHUB_OUTPUT"

  # In Chrome on SQLite, in three shards side by side, each its own server and database with a share of the specs
  # (web/e2e-shards.ts, ORR-920): whole, a suite took 15 to 25 minutes, and a flaky one run again took a release past 40.
  # Not on Postgres: the browser can't tell which database is behind the Rust API, and the api job runs parity and the
  # migrations on Postgres; the perf job still runs on both (ORR-1269).
  # WebKit and Firefox run the specs where an engine differs (CROSS_BROWSER in web/playwright.config.ts), one job each:
  # the whole suite in them took nine jobs and failed most on timing, not on what the engine did (ORR-1269).
  e2e:
    # The Rust API serves the board's data, its Nuxt routes gone (ORR-1041), so the server starts the api job's binary.
    needs: [playwright, api]
    runs-on: ubuntu-latest
    # A shard takes under ten minutes; this leaves room for Firefox and WebKit with retries (ORR-912).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        shard: ['1', '2', '3']
        include:
          - {browser: webkit, shard: cross}
          - {browser: firefox, shard: cross}
    # Playwright's own image has the browser and the system libraries it needs. Installing those with apt on
    # every run took from 10 seconds to 11 minutes, as Ubuntu's mirror allowed.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    env:
      E2E_BROWSER: ${{ matrix.browser }}
      E2E_SHARD: ${{ matrix.shard != 'cross' && format('{0}/3', matrix.shard) || '' }}
      E2E_CROSS_BROWSER: ${{ matrix.shard == 'cross' && '1' || '' }}
      NUXT_API_BIN: ${{ github.workspace }}/.api/orrery-api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orrery-api
          path: .api
      # An artifact doesn't keep the file's mode.
      - run: chmod +x .api/orrery-api
      # What the server behind the suite reached counts as covered (ORR-745), and what the page ran (ORR-784).
      - run: pnpm test:e2e
        env:
          # The image runs as root, and Firefox won't start with a home folder that's another user's.
          HOME: /root
          NODE_V8_COVERAGE: ${{ matrix.browser == 'chromium' && format('{0}/.v8-e2e', github.workspace) || '' }}
          # What the page's own code ran in Chrome (ORR-784) is off for now: with it, pages took past 5s to load early in the
          # run, so specs failed from the first minute and the job ran out of time (ORR-912). `pnpm test:e2e` with
          # E2E_PAGE_COVERAGE set still collects it.
          E2E_PAGE_COVERAGE: ''
      - run: node web/scripts/coverage-lines.mjs --v8 .v8-e2e --pages .page-e2e --out web/e2e-lines.json
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        continue-on-error: true
      - run: pnpm test:e2e:login
        if: matrix.browser == 'chromium' && matrix.shard == '1'
      # This shard's results and lines, which e2e-report puts together with the other shards'; a failed shard's too.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            web/blob-report/
            web/e2e-lines.json
          retention-days: 1
      # The report carries the traces of the failed tests (open with `pnpm exec playwright show-report`), a job that ran
      # out of time too, as that's when they're most needed (ORR-912).
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7

  # What outlives a restart (web/e2e/restart, ORR-1310): the built app, stopped and started on its own SQLite file, as a
  # rebuild or a container restart does. The only test of a real import between two orrerys (`importOrrery`'s write path,
  # what moving to a server goes through, ORR-1209) and of a chat carried on after orrery restarts. Run when the e2e flows
  # are, in a job of its own, as it builds the app rather than running `nuxt dev`.
  restart:
    needs: [playwright, api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    env:
      NUXT_API_BIN: ${{ github.workspace }}/.api/orrery-api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orrery-api
          path: .api
      # An artifact doesn't keep the file's mode.
      - run: chmod +x .api/orrery-api
      # The api job's binary stands in for the script's own `cargo build`, as the image has no Rust.
      - run: pnpm --dir web build
      - run: pnpm --dir web test:e2e:restart
        env:
          RESTART_NO_BUILD: '1'
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: playwright-report-restart
          path: web/test-results-restart/
          retention-days: 7

  # The SQLite and Chrome shards' results and lines as one run, as the suite gave them whole: what `pnpm test:report`
  # reads at ship time (Releasing, ORR-678), under the same artifact name.
  e2e-report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-shard-*
          path: shards
      - run: |
          mkdir -p blobs lines
          for shard in shards/*/; do
            name=$(basename "$shard")
            cp "$shard"blob-report/*.zip blobs/ 2>/dev/null || true
            [ -f "$shard"e2e-lines.json ] && cp "$shard"e2e-lines.json "lines/$name.json"
          done
          ls blobs lines
          # A shard missing would leave its tests out of the numbers without a word.
          [ "$(ls blobs | wc -l)" -eq 3 ] || { echo "Expected 3 shards' blobs, found $(ls blobs | wc -l)"; exit 1; }
      - run: pnpm exec playwright merge-reports --reporter json ../blobs
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
      - run: node web/scripts/coverage-lines.mjs --pages lines --out web/e2e-lines.json
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e
          path: |
            web/e2e-results.json
            web/e2e-lines.json
          retention-days: 30

  # How fast the pages are on a big orrery (web/e2e/perf), run when the e2e flows are. A page over its budget fails
  # it. The report (each page's time, its API calls and their sizes) is kept every run, passed or not.
  perf:
    needs: [playwright, api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery
          POSTGRES_DB: orrery_e2e
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_POSTGRES_URL: ${{ matrix.database == 'postgres' && 'postgres://orrery:orrery@postgres:5432/orrery_e2e' || '' }}
      NUXT_API_BIN: ${{ github.workspace }}/.api/orrery-api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: orrery-api
          path: .api
      # An artifact doesn't keep the file's mode.
      - run: chmod +x .api/orrery-api
      - run: pnpm test:e2e:perf
      - run: cat perf-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
        if: always()
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report-${{ matrix.database }}
          path: |
            web/perf-report/
            web/playwright-report/
          retention-days: 30

  # A release builds the image itself, for both platforms.
  docker:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
