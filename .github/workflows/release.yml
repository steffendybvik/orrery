# The production image on GitHub's container registry, on a release tag (`v1.0.0`):
# ghcr.io/<owner>/orrery:1.0.0, :1.0, :1 and :latest, for Intel and Apple silicon. Only once CI passes
# on the tag, so a red tag never publishes an image. A release candidate (`v1.0.0-rc.1`) gets only its
# own tag, so :latest stays on the last release. Each platform builds on a runner of its own: under emulation, the
# arm64 build sometimes stuck at `pnpm build` until GitHub's 6-hour limit (ORR-715). The tags go on once both are in.
# Then the GitHub release, its notes from the version's section of CHANGELOG.md, with the files to run it attached (ORR-742).
# A tag whose version has no section stops before anything publishes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node web/scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > /dev/null

  image:
    needs: [checks, changelog]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/orrery
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/orrery,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - run: mkdir digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  tags:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/orrery
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/orrery@sha256:%s ' *)

  # The files to run the release with the published image: compose.yml, .env.example and a README (release/), with its
  # version filled in, as orrery-<version>.zip and compose.yml. They go up with the release here, as one made with
  # GITHUB_TOKEN sets off no other workflow. Run again, it brings the release back in step with the tag.
  github-release:
    needs: tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Fill in the version and zip them
        run: |
          version="${TAG#v}"
          mkdir -p "dist/orrery-$version"
          for file in compose.yml .env.example README.md; do
            sed "s/__VERSION__/$version/g" "release/$file" > "dist/orrery-$version/$file"
          done
          ! grep -r __VERSION__ dist
          docker compose -f "dist/orrery-$version/compose.yml" config --quiet
          (cd dist && zip -r "orrery-$version.zip" "orrery-$version")
          cp "dist/orrery-$version/compose.yml" dist/compose.yml
      - run: node web/scripts/changelog-section.mjs "${TAG#v}" > dist/notes.md
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("dist/orrery-${TAG#v}.zip" dist/compose.yml)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file dist/notes.md
          elif [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" "${files[@]}" --verify-tag --title "$TAG" --notes-file dist/notes.md --prerelease
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "$TAG" --notes-file dist/notes.md
          fi
