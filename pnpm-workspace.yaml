# The repo root holds the channel (`channel/`, run by path from other repos, so its one dependency is the
# root's) and scripts that run in the app; the Nuxt app is its own package in web/.
packages:
  - web
onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
# Above what a dependency asks for, for a fix it hasn't taken up yet. node-forge: nuxt's dev server (listhen), GHSA-4487-j8r4-4g2f and others.
overrides:
  node-forge: ^1.4.1
