# The repo root holds the channel (`channel/`, run by path from other repos, so its one dependency is the
# root's) and scripts that run in the app; the Nuxt app is its own package in web/.
packages:
  - web
onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
# Above what a dependency asks for, for a fix it hasn't taken up yet. node-forge: nuxt's dev server (listhen), GHSA-4487-j8r4-4g2f and others.
# hono and @hono/node-server: the channel's MCP SDK, GHSA-3gg2-335m-rxc6 and others.
# glob: build and test tooling (@vercel/nft, js-beautify), GHSA-3g3m-2fjr-6pw4.
# minimatch: lint, build and test tooling (typescript-eslint, eslint-plugin-import-x from 4.18, readdir-glob,
# editorconfig), GHSA-g3hv-75wg-m249. None call the `makeRe` export 11 drops.
overrides:
  node-forge: ^1.4.3
  hono: ^4.13.16
  '@hono/node-server': ^2.1.6
  'glob@>=9 <14.0.2': ^14.0.2
  'minimatch@>=7 <11.0.1': ^11.0.1
