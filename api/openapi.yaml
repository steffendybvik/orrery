    get:
      x-served: false
      summary: What the local app reads of a repo it polls, for the poll, the PR list and the branches
      description: >-
        `repo` is when it was last polled, whether with a token, what went wrong then and the page of its closed PRs to
        read next, null before its first poll. `pulls` is each PR the poll keeps, as kept, and `recorded` each PR kept on
