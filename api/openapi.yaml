                token: {type: boolean}
                more: {type: boolean}
                pulls: {type: array, items: {type: object, description: 'A `pull_states` row but `repo` and `seen_at`, with `names` and `told` as lists'}}
      responses:
        '204': {description: Kept}
        '400': {$ref: '#/components/responses/BadRequest'}
