        '201': {description: The preset, content: {application/json: {schema: {$ref: '#/components/schemas/Preset'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  parameters:
    project: {name: project, in: path, required: true, description: The project's id, schema: {type: string}}
    doc: {name: doc, in: path, required: true, description: 'The doc''s id, or its full id on this board (`doc-ideas-x7k2m3qd`)', schema: {type: string}}
    revision: {name: revision, in: path, required: true, description: 'A revision''s id; ids run across the orrery', schema: {type: integer, minimum: 1}}
    issue: {name: issue, in: path, required: true, description: 'The issue''s id (`ORR-12`), an id it had before (an alias), or the full form of either on this board (`ORR-12-x7k2m3qd`)', schema: {type: string}}
    milestone: {name: milestone, in: path, required: true, description: 'The milestone''s id (`3`), an id it had before, or the full form of either on this board (`MLS-3-x7k2m3qd`), or as it''s shown (`MLS-3`)', schema: {type: string}}
    release: {name: release, in: path, required: true, description: The release's version, schema: {type: string}}
    preset: {name: preset, in: path, required: true, description: 'The preset''s number, or its full id on this server (`pst-12-x7k2m3qd`)', schema: {type: string}}
    comment: {name: comment, in: path, required: true, description: 'A comment''s id; ids run across the orrery', schema: {type: integer, minimum: 1}}
    epic: {name: epic, in: path, required: true, description: 'The epic''s number (`3`), as it''s shown (`EPC-3`), or its full id on this server (`EPC-3-x7k2m3qd`)', schema: {type: string}}
    actor:
      name: Orrery-Actor
      in: header
      description: Who's writing; the owner's name writes as the owner. With login on, the credential decides.
      schema: {type: string, maxLength: 60}
  responses:
    BadRequest: {description: 'The body is wrong: `data.problems` says each thing', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: 'The owner''s call: `data.permission` names the row that says so', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: 'No such project, doc, revision, section, issue, comment, milestone, release, person, key, login, secret or pull request', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Taken already, or not the same kind, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    ReleaseInput:
      type: object
      description: '`version` is needed to make one, and can''t change. A change takes any of the rest; all but `position` can be null.'
      additionalProperties: false
      properties:
        version: {type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,39}$'}
        branch: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        frozen_on: {type: [string, 'null'], pattern: '^\d{4}-\d{2}-\d{2}$'}
        shipped_on: {type: [string, 'null'], pattern: '^\d{4}-\d{2}-\d{2}$'}
        position: {type: number}
    MilestoneInput:
      type: object
      description: '`title` is needed to make one. A change takes any of them; `summary` and `priority` can be null.'
      additionalProperties: false
      properties:
        title: {type: string}
        summary: {type: [string, 'null']}
        priority: {type: [string, 'null'], enum: [P0, P1, P2, P3, null]}
        position: {type: number}
    DocKind: {type: string, enum: [markdown, artifact], description: '`artifact`: its text is HTML, only drawn in a sandboxed frame. Fixed when it''s made.'}
    DocInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$'}
        title: {type: string, minLength: 1, description: Trimmed; not only spaces}
        body: {type: string, description: Markdown, or HTML for an artifact}
        position: {type: number}
        section: {type: [string, 'null'], description: Trimmed to 60 characters; empty or null is none}
        kind: {$ref: '#/components/schemas/DocKind'}
    DocChange:
      type: object
      additionalProperties: false
      description: A doc's fields, all optional; `id` and `kind` only as they are.
      properties:
        id: {type: string}
        title: {type: string, minLength: 1}
        body: {type: string}
        position: {type: number}
        section: {type: [string, 'null']}
        kind: {$ref: '#/components/schemas/DocKind'}
    DocSummary:
      type: object
      required: [id, title, kind, summary, created_by, protected, created_at, updated_at]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {$ref: '#/components/schemas/DocKind'}
        summary: {type: string, description: 'Its first paragraph as plain text, cut to about 160 characters; empty for an artifact'}
        match: {type: string, description: 'With `q`: the text around its first hit; empty when only the title has it'}
        section: {type: string, description: Left out when it's under none}
        created_by: {type: string}
        protected: {type: boolean, description: The owner made it}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Doc:
      allOf:
        - $ref: '#/components/schemas/DocSummary'
        - type: object
          required: [project, body, full_id]
          properties:
            project: {type: string}
            body: {type: string}
            full_id: {type: string, description: 'Its id to paste anywhere: `doc-<id>-<the board''s uid>`'}
    DocRevisionSummary:
      type: object
      required: [id, title, kind, deleted, created_by, created_at]
      properties:
        id: {type: integer}
        title: {type: string}
        kind: {$ref: '#/components/schemas/DocKind'}
        deleted: {type: boolean, description: The doc being removed here; this holds its last text}
        created_by: {type: string}
        session_name: {type: string, description: The session that wrote it, by its name then}
        created_at: {type: string, format: date-time}
    DocRevision:
      allOf:
        - $ref: '#/components/schemas/DocRevisionSummary'
        - type: object
          required: [project, doc, body]
          properties:
            project: {type: string}
            doc: {type: string}
            body: {type: string}
    DeletedDoc:
      type: object
      required: [id, title, kind, summary, revision, deleted_by, deleted_at]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {$ref: '#/components/schemas/DocKind'}
        summary: {type: string}
        revision: {type: integer, description: The revision that says it was removed}
        deleted_by: {type: string}
        deleted_at: {type: string, format: date-time}
    SectionName:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 60, description: Trimmed; not empty}
    BoardMember:
      type: object
      required: [person, name, role, created_at]
      properties:
        person: {type: string, description: Their id}
        name: {type: string}
        role: {type: string, enum: [owner, member], description: '`owner` for the board''s holder'}
        created_at: {type: string, format: date-time}
    Owner:
      type: object
      required: [name, display, named]
      properties:
        name: {type: string, description: Their id, which the page sends as `Orrery-Actor`}
        display: {type: string, description: Their name as the page shows it}
        named: {type: boolean, description: Whether they've given their name yet}
    Person:
      type: object
      required: [id, name, role, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [owner, member]}
        created_at: {type: string, format: date-time}
        removed_at: {type: string, format: date-time}
    PersonInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, description: Trimmed to 60 characters; needs a letter or a digit}
    KeyKind: {type: string, enum: [agent, person], description: '`agent`: a machine''s sessions; `person`: swapped for a login on the page'}
    Key:
      type: object
      required: [id, person, kind, name, created_at]
      properties:
        id: {type: string}
        person: {type: string}
        kind: {$ref: '#/components/schemas/KeyKind'}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    NewKey:
      allOf:
        - {$ref: '#/components/schemas/Key'}
        - {type: object, required: [key], properties: {key: {type: string, description: '`orrery_<kind>_…`: shown this once'}}}
    KeyInput:
      type: object
      required: [kind, name]
      properties:
        kind: {$ref: '#/components/schemas/KeyKind'}
        name: {type: string, description: What it's for, such as the machine it's on; trimmed to 60 characters, not empty}
        person: {type: string, description: Whose it is; the owner's to give to another}
    Login:
      type: object
      required: [id, person, expires_at]
      properties:
        id: {type: string, description: The first 16 hex digits of its hash}
        person: {type: string}
        name: {type: string, description: How it was made}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        current: {type: boolean, const: true, description: The asking browser's own}
    Preset:
      type: object
      required: [id, project, name, text, icon, color, created_at, updated_at]
      properties:
        id: {type: integer}
        project: {type: [string, 'null'], description: The project's own, or null for the orrery's}
        name: {type: string}
        text: {type: string, description: What a session started with it is told}
        icon: {type: [string, 'null'], description: A Heroicon's name}
        color: {type: [string, 'null'], description: A named tint or a colour like #3b82f6}
        default:
          type: object
          description: Only on one orrery ships
          required: [key, changed]
          properties:
            key: {type: string}
            changed: {type: boolean, description: Whether its name, text or badge differ from what orrery ships}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PresetInput:
      type: object
      additionalProperties: false
      description: '`name` and `text` are required to make one, and trimmed'
      properties:
        name: {type: string, minLength: 1}
        text: {type: string, minLength: 1}
        icon: {type: [string, 'null'], pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        color: {type: [string, 'null'], pattern: '^(slate|blue|teal|green|amber|rose|violet|#[0-9a-fA-F]{6})$'}
    Status:
      type: object
      required: [id, name, kind, color, position]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {$ref: '#/components/schemas/StatusKind'}
        color: {type: string, description: 'A named tint (slate, blue, teal, green, amber, rose, violet) or `#rrggbb`'}
        position: {type: number}
    StatusKind: {type: string, enum: [backlog, todo, started, done, canceled]}
    StatusInput:
      type: object
      description: '`name` and `kind` are required to add one; a change sends any of them. Unknown fields are refused.'
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$'}
        name: {type: string, minLength: 1}
        kind: {$ref: '#/components/schemas/StatusKind'}
        color: {type: string, pattern: '^(slate|blue|teal|green|amber|rose|violet|#[0-9a-fA-F]{6})$'}
        position: {type: number}
    Instruction:
      type: object
      required: [id, text, on]
      properties:
        id: {type: string}
        text: {type: string, minLength: 1}
        on: {type: boolean}
    Starts:
      type: object
      description: 'orrery starts sessions for any project with a launcher: at most `limit` at once, `min` kept running, each for `minutes`, stopped after `idle_minutes` idle; `on_signal` false keeps work that finds nobody listening from starting one.'
      required: [limit]
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 20}
        min: {type: integer, minimum: 1}
        minutes: {type: integer, minimum: 1, maximum: 1440}
        idle_minutes: {type: integer, minimum: 1, maximum: 1440}
        on_signal: {type: boolean}
    WorkKind:
      type: object
      required: [id, name, labels, model]
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$'}
        name: {type: string, minLength: 1}
        labels: {type: array, items: {type: string}, description: Lowercase; a label is in one kind only}
        model: {type: string, description: 'best, opus, sonnet, haiku, fable, default, opusplan, or a full id (claude-…)'}
        effort: {type: string, enum: [low, medium, high, xhigh, max]}
    Settings:
      type: object
      required: [id, tint, statuses, focus_prompt, milestone_prompt, instructions, handle, uid, tracker, starts, terminal, agent, restrict_proposals, advanced, count_use, work_kinds, starred, hidden]
      properties:
        id: {type: string, description: 'This orrery''s id, `orr_` and six hex digits'}
        tint: {type: [string, 'null']}
        statuses: {type: array, items: {$ref: '#/components/schemas/Status'}}
        focus_prompt: {type: [string, 'null']}
        milestone_prompt: {type: [string, 'null']}
        instructions: {type: array, items: {$ref: '#/components/schemas/Instruction'}}
        handle: {type: [string, 'null']}
        uid: {type: string}
        tracker: {type: [string, 'null']}
        starts: {oneOf: [{$ref: '#/components/schemas/Starts'}, {type: 'null'}]}
        terminal: {type: string, enum: [terminal, iterm, warp, ghostty]}
        agent: {type: string, enum: [claude, other], description: 'The AI agent the owner runs (ORR-1075): claude, or other for one with no launcher adapter yet'}
        restrict_proposals: {type: boolean}
        advanced: {type: boolean}
        count_use: {type: boolean}
        work_kinds: {type: array, items: {$ref: '#/components/schemas/WorkKind'}}
        starred: {type: array, items: {type: string}, description: Project ids listed first; none that are hidden}
        hidden: {type: array, items: {type: string}}
    SettingsInput:
      type: object
      description: Any of them; null puts one back to its default. Unknown fields are refused.
      additionalProperties: false
      properties:
        tint: {type: [string, 'null'], pattern: '^(slate|blue|teal|green|amber|rose|violet|#[0-9a-fA-F]{6})$'}
        focus_prompt: {type: [string, 'null']}
        milestone_prompt: {type: [string, 'null']}
        instructions: {type: [array, 'null'], items: {type: object, required: [text], properties: {id: {type: string}, text: {type: string, minLength: 1}, on: {type: boolean}}}}
        tracker: {type: [string, 'null'], pattern: '^https?://\S*\{id\}\S*$'}
        handle: {type: [string, 'null'], pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,38}$'}
        starts: {oneOf: [{$ref: '#/components/schemas/Starts'}, {type: 'null'}]}
        terminal: {type: [string, 'null'], enum: [terminal, iterm, warp, ghostty, null]}
        agent: {type: [string, 'null'], enum: [claude, other, null]}
        restrict_proposals: {type: boolean}
        advanced: {type: boolean}
        work_kinds: {type: [array, 'null'], minItems: 1, items: {$ref: '#/components/schemas/WorkKind'}}
        count_use: {type: boolean}
        starred: {type: [array, 'null'], items: {type: string, minLength: 1}}
        hidden: {type: [array, 'null'], items: {type: string, minLength: 1}}
    Asks: {type: string, enum: [decision, feedback], description: What a question waits on the owner for}
    Counts: {type: object, additionalProperties: {type: integer}, description: 'How many leaf issues are in each column, by its id; only columns with some'}
    Kinds:
      type: object
      description: How many leaf issues are of each kind of column, every kind listed
      required: [backlog, todo, started, done, canceled, proposed]
      properties:
        backlog: {type: integer}
        todo: {type: integer}
        started: {type: integer}
        done: {type: integer}
        canceled: {type: integer}
        proposed: {type: integer}
    Place: {type: string, enum: [backlog, todo, started, done, canceled, proposed], description: What a column means}
    Choice:
      type: object
      description: A question on a proposal, for the owner to pick from; stored and handed back as written
      additionalProperties: true
    PullRisk:
      type: object
      required: [level, why, by]
      properties:
        level: {type: string, enum: [low, medium, high]}
        why: {type: string}
        by: {type: string, enum: [owner, session]}
    Issue:
      type: object
      description: |
        An issue as the board draws it. Its column comes from its sub-issues' when it has any: closed when every
        committed one is (its first done status with some, else canceled), else the least-along open status any is in;
        `proposed` when it is a proposal or under one. Fields marked "only with some" are left out rather than empty.
      required: [id, title, labels, external, github_issues, status, choices, column, kind, counts, kinds, comments, aliases, created_by, protected, created_at, updated_at]
      properties:
        id: {type: string}
        title: {type: string}
        priority: {type: string, enum: [P0, P1, P2, P3]}
        assignee: {type: string, description: 'A person''s id, or `claude`'}
        labels: {type: array, items: {type: string}}
        external: {type: array, items: {type: string}}
        github_issues: {type: array, items: {type: string}, description: 'Each `owner/name#523`'}
        status: {type: string, description: Its own status as written; a parent's columns come from its sub-issues}
        notes: {type: string}
        proposal: {type: string, enum: [pending, approved, changes, rejected]}
        decided_by: {type: string}
        decided_at: {type: string, format: date-time}
        decision_note: {type: string}
        choices: {type: array, items: {$ref: '#/components/schemas/Choice'}}
        picks: {type: object, additionalProperties: {type: array, items: {type: string}}}
        explore: {type: object, required: [choice, option], properties: {choice: {type: string}, option: {type: string}}}
        column: {type: string}
        kind: {$ref: '#/components/schemas/Place'}
        counts: {$ref: '#/components/schemas/Counts'}
        kinds: {$ref: '#/components/schemas/Kinds'}
        comments: {type: integer}
        waiting:
          allOf: [{$ref: '#/components/schemas/Asks'}]
          description: |
            Its latest question from an agent with no comment of the owner's after it; else `decision` for a pending
            proposal an agent made that isn't under another proposal. Never on one that's done or canceled.
        aliases: {type: array, items: {type: string}, description: 'Ids it had before, A–Z'}
        schedule: {type: integer}
        release: {type: string}
        model: {type: string, description: Only with one}
        effort: {type: string, description: Only with one}
        created_by: {type: string}
        session_name: {type: string, description: Only with one}
        claimed_by: {type: string, description: Only with one}
        claimed_at: {type: string, format: date-time, description: Only with `claimed_by`}
        protected: {type: boolean, description: Made by the owner}
        depends_on: {type: array, items: {type: string}, description: 'Only with some: `ID` here, `project/ID` in another, in the order linked'}
        blocked_by: {type: array, items: {type: string}, description: 'Only with some: those of `depends_on` not done (a proposal isn''t done)'}
        blocks: {type: array, items: {type: string}, description: 'Only with some: the issues that depend on it'}
        risk: {allOf: [{$ref: '#/components/schemas/PullRisk'}], description: 'Only once a PR is rated: its riskiest'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    IssueRecord:
      description: An issue in a list, flat
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [project, ref, full_id, parent, milestone, sub_issues]
          properties:
            project: {type: string}
            ref: {type: string, description: '`orrery-<handle>: <id>`, the handle being the setting''s, else the owner''s id'}
            full_id: {type: string, description: '`ORR-12-x7k2m3qd`: its id with the project''s uid'}
            parent: {type: [string, 'null']}
            milestone: {type: [string, 'null'], description: 'The milestone it''s in, a sub-issue''s being its top-level issue''s'}
            sub_issues: {type: array, items: {type: string}, description: Its sub-issues one level down, by id, in board order}
            match_in: {type: string, enum: [description, comment], description: 'Only from `in=all`, when the words aren''t in its id and title'}
            match: {type: string, description: 'Only with `match_in`, and not on an `external` one: up to 60 characters before the first word and 100 after, cut at spaces, `…` where cut'}
    IssueDetail:
      description: One issue, its sub-issues nested in `tasks`
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [project, ref, full_id, parent, milestone, tasks]
          properties:
            project: {type: string}
            ref: {type: string}
            full_id: {type: string}
            parent: {type: [string, 'null']}
            milestone: {type: [string, 'null']}
            tasks: {type: array, items: {$ref: '#/components/schemas/Issue'}, description: 'Each with its own `tasks`, to any depth'}
    Milestone:
      type: object
      description: A milestone as the board draws it, its column rolled up from its issues as an issue's is from its sub-issues'
      required: [id, title, column, kind, counts, kinds, aliases, created_by, protected, project, position, created_at, updated_at, issues]
      properties:
        id: {type: string}
        title: {type: string}
        summary: {type: string, description: Only with one}
        priority: {type: string, enum: [P0, P1, P2, P3]}
        column: {type: string}
        kind: {$ref: '#/components/schemas/Place'}
        counts: {$ref: '#/components/schemas/Counts'}
        kinds: {$ref: '#/components/schemas/Kinds'}
        aliases: {type: array, items: {type: string}, description: 'Ids it had before, A–Z'}
        created_by: {type: string}
        protected: {type: boolean}
        project: {type: string}
        position: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        issues: {type: array, items: {type: string}, description: Its top-level issues by id, in board order}
    MilestoneDetail:
      description: One milestone, its issues in full
      allOf:
        - $ref: '#/components/schemas/Milestone'
        - type: object
          required: [tasks, full_id]
          properties:
            tasks: {type: array, items: {$ref: '#/components/schemas/Issue'}}
            full_id: {type: string, description: '`MLS-3-x7k2m3qd`: its id with the project''s uid'}
    Release:
      type: object
      description: 'A release, with `issues` those set for it (a sub-issue''s when it differs from its parent''s) and `kinds` the leaves under them'
      required: [version, created_by, protected, created_at, updated_at, issues, kinds]
      properties:
        version: {type: string}
        branch: {type: string}
        notes: {type: string}
        frozen_on: {type: string}
        shipped_on: {type: string}
        doc_mark: {type: integer, description: 'The newest doc revision when it shipped'}
        created_by: {type: string}
        protected: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        issues: {type: integer}
        kinds: {$ref: '#/components/schemas/Kinds'}
    ReleaseDetail:
      allOf:
        - $ref: '#/components/schemas/Release'
        - type: object
          required: [project, tasks, projects]
          properties:
            project: {type: string}
            tasks: {type: array, items: {$ref: '#/components/schemas/Issue'}}
            projects:
              type: array
              items:
                type: object
                required: [project, name, issues, kinds, tasks]
                properties:
                  project: {type: string}
                  name: {type: string}
                  issues: {type: integer}
                  kinds: {$ref: '#/components/schemas/Kinds'}
                  tasks: {type: array, items: {$ref: '#/components/schemas/Issue'}}
    ProjectInput:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, description: Only its own; an id can't change}
        name: {type: string}
        key: {type: string, pattern: '^[A-Z][A-Z0-9]{0,9}$'}
        description: {type: [string, 'null']}
        icon: {type: [string, 'null'], description: "A Heroicon's name"}
        icon_color: {type: [string, 'null'], description: 'slate, blue, teal, green, amber, rose, violet, or #rrggbb'}
        focus_prompt: {type: [string, 'null']}
        milestone_prompt: {type: [string, 'null']}
        instructions: {type: [array, 'null'], items: {type: object, required: [text], properties: {id: {type: string}, text: {type: string}, on: {type: boolean}}}}
        muted: {type: [array, 'null'], items: {type: string}}
        repo: {type: [string, 'null']}
        release_mode: {type: string, enum: [none, own, shared]}
        releases_from: {type: [string, 'null']}
    Project:
      description: A project as ProjectSummary has it, with its whole board in place of the counts
      type: object
      required: [id, name, board]
      properties:
        id: {type: string}
        name: {type: string}
        board: {type: object, required: [milestones, counts, kinds], properties: {milestones: {type: array, items: {type: object}}, counts: {$ref: '#/components/schemas/Counts'}, kinds: {$ref: '#/components/schemas/Kinds'}}}
    ProjectSummary:
      type: object
      required: [id, name, key, uid, instructions, muted, release_mode, created_by, protected, created_at, updated_at, docs, doc_sections, releases, counts, kinds, milestones]
      properties:
        id: {type: string}
        name: {type: string}
        key: {type: string, description: 'What its issue ids start with: KEY-n'}
        uid: {type: string}
        description: {type: string}
        icon: {type: string}
        icon_color: {type: string}
        focus_prompt: {type: string, description: Its own focus template; left out when it uses the orrery's}
        milestone_prompt: {type: string, description: Its own milestone template; left out when it uses the orrery's}
        instructions: {type: array, items: {type: object}}
        muted: {type: array, items: {type: string}}
        starts: {type: object, description: 'Whether orrery may start sessions, and within what: the orrery''s setting; left out until the owner lets it'}
        repo: {type: string}
        release_mode: {type: string, enum: [none, own, shared]}
        releases_from: {type: string, description: The project it takes its releases from, when shared}
        created_by: {type: string}
        protected: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        docs: {type: array, items: {$ref: '#/components/schemas/DocSummary'}}
        doc_sections: {type: array, items: {type: string}}
        releases: {type: array, items: {$ref: '#/components/schemas/Release'}}
        counts: {$ref: '#/components/schemas/Counts'}
        kinds: {$ref: '#/components/schemas/Kinds'}
        milestones: {type: integer, description: How many milestones it has}
    ProjectReleases:
      type: object
      required: [project, projects, releases]
      properties:
        project: {type: string}
        projects: {type: array, items: {type: string}, description: 'It, then those drawing on it, A–Z'}
        releases:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Release'
              - type: object
                required: [projects]
                properties:
                  projects: {type: array, items: {type: object, required: [project, issues, kinds], properties: {project: {type: string}, issues: {type: integer}, kinds: {$ref: '#/components/schemas/Kinds'}}}}
    CommentEdit:
      type: object
      additionalProperties: false
      properties:
        body: {type: string, description: Markdown; not blank}
        asks: {type: [string, 'null'], enum: [decision, feedback, null]}
    CommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, description: Markdown; not blank}
        asks: {type: [string, 'null'], enum: [decision, feedback, null], description: 'Waits on the owner until they comment after it'}
    Comment:
      type: object
      required: [id, issue, body, created_by, protected, created_at, updated_at]
      properties:
        id: {type: integer}
        issue: {type: string}
        body: {type: string, description: Markdown}
        asks: {$ref: '#/components/schemas/Asks'}
        answered: {type: boolean, description: 'Only with `asks`: whether the owner has commented on the issue since'}
        schedule: {type: object, additionalProperties: true, description: 'A session''s request to make or change a schedule (ORR-458), with its state'}
        created_by: {type: string}
        session_name: {type: string, description: Only with one}
        protected: {type: boolean, description: Written by the owner}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Notice:
      description: 'A comment of an agent''s, with its project and issue''s title; or a proposal waiting on the owner, with id 0 and `proposal`'
      allOf:
        - {$ref: '#/components/schemas/Comment'}
        - type: object
          required: [project, title]
          properties:
            project: {type: string}
            title: {type: string, description: The issue's}
            cleared: {type: boolean, description: Only when it's been cleared}
            read: {type: boolean, description: Only when it's been opened}
            proposal: {type: object, required: [choices], properties: {choices: {type: integer}}, description: 'Only on a proposal: how many choices it offers'}
    NoticeChange:
      type: object
      required: [id, project, issue, created_by, created_at]
      properties:
        id: {type: integer}
        project: {type: string}
        issue: {type: string}
        before: {type: string, description: The status it had, when it had one}
        after: {type: string, description: The status it has, when it has one}
        created_by: {type: string}
        session_name: {type: string, description: Only with one}
        created_at: {type: string, format: date-time}
    EpicInput:
      type: object
      properties:
        title: {type: string, description: Needed to make one; not blank}
        notes: {type: [string, 'null'], description: Markdown}
        position: {type: number, description: Where it goes among the epics, 0 the top}
    EpicPart:
      type: object
      required: [project, issues, kinds]
      properties:
        project: {type: string}
        issues: {type: integer}
        kinds: {$ref: '#/components/schemas/Kinds'}
    Epic:
      type: object
      required: [id, full_id, title, issues, kinds, projects, created_by, protected, created_at, updated_at]
      properties:
        id: {type: integer, description: Its number across the orrery}
        full_id: {type: string, description: '`EPC-<id>-<uid>`, with the server''s uid'}
        title: {type: string}
        notes: {type: string, description: Only with some}
        issues: {type: integer, description: Those set for it, in every project}
        kinds: {$ref: '#/components/schemas/Kinds'}
        projects: {type: array, items: {$ref: '#/components/schemas/EpicPart'}, description: Each project with an issue in it}
        created_by: {type: string}
        protected: {type: boolean, description: Made by the owner}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EpicDetail:
      allOf:
        - {$ref: '#/components/schemas/Epic'}
        - type: object
          required: [parts]
          properties:
            parts:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/EpicPart'}
                  - {type: object, required: [name, tasks], properties: {name: {type: string}, tasks: {type: array, items: {$ref: '#/components/schemas/Issue'}}}}
    ThreadCommentInput:
      type: object
      properties:
        body: {type: string, description: 'Markdown, not blank; needed to make one'}
    ThreadComment:
      type: object
      required: [id, body, created_by, protected, created_at, updated_at]
      properties:
        id: {type: integer, description: Numbered across the orrery's milestone comments, or its epic comments}
        project: {type: string, description: On a milestone's}
        milestone: {type: string, description: On a milestone's}
        epic: {type: integer, description: On an epic's}
        body: {type: string, description: Markdown}
        created_by: {type: string}
        session_name: {type: string, description: Only with one}
        protected: {type: boolean, description: Written by the owner}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Secret:
      type: object
      required: [name, last4, hosts, projects, created_by, created_at, updated_at, last_used]
      properties:
        name: {type: string}
        last4: {type: string, description: The value's last 4 characters; nothing gives the rest back}
        hosts: {type: array, items: {type: string}, description: 'Where it may be sent: `api.stripe.com`, `deploy.lan:8443`'}
        projects: {type: [array, 'null'], items: {type: string}, description: The projects that may use it; null for any}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_used: {oneOf: [{$ref: '#/components/schemas/SecretUse'}, {type: 'null'}]}
    KeptPull:
      type: object
      required: [number, url, base, state, merged_at, updated_at]
      properties:
        number: {type: integer}
        title: {type: string, description: The owner's only}
        url: {type: string}
        branch: {type: string, description: The head branch; the owner's only}
        base: {type: string}
        author: {type: string, description: 'For anyone but the owner, only when it''s a plain login'}
        state: {type: string, enum: [open, merged, closed]}
        merged_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
    SecretUse:
      type: object
      required: [id, secret, method, host, path, project, issue, status, error, created_by, created_at]
      properties:
        id: {type: integer}
        secret: {type: string}
        method: {type: string}
        host: {type: string}
        path: {type: string, description: With any value scrubbed out}
        project: {type: [string, 'null']}
        issue: {type: [string, 'null']}
        status: {type: [integer, 'null'], description: The answer's status; null when it failed}
        error: {type: [string, 'null']}
        created_by: {type: string, description: Who sent it; `orrery` for its own requests}
        created_at: {type: string, format: date-time}
    IssueEvent:
      type: object
      required: [id, issue, field, created_by, protected, created_at]
      properties:
        id: {type: integer}
        issue: {type: string}
        field: {type: string, description: 'What changed: `created`, `status`, `title`, `claim`, `uploaded` and the like'}
        before: {type: string, description: Only when it had a value}
        after: {type: string, description: Only when it has one}
        created_by: {type: string}
        session_name: {type: string, description: Only with one}
        protected: {type: boolean, description: Made by the owner}
        created_at: {type: string, format: date-time}
    Error:
      type: object
      required: [statusCode, statusMessage, message]
      properties:
        statusCode: {type: integer}
        statusMessage: {type: string}
        message: {type: string}
        data:
          type: object
          properties:
            problems: {type: array, items: {type: string}}
            permission: {type: string}
