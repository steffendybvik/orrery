openapi: 3.1.0
info:
  title: orrery API
  version: 1.0.0-rc.18 # the orrery release it was written against
  description: |
    The domains of orrery's HTTP API that move to the Rust API in api/, each written from the Nuxt server's routes
    first, as the contract both answer alike to (web/test/api-parity.test.ts holds them to it):

    - **Docs** (ORR-922): a project's docs, their sections and their revisions (web/server/api/projects/[project]/docs,
      doc-sections, deleted-docs). Served by both.
    - **Issues and comments, reading** (ORR-927): the issue list with its filters, one issue, and its comments
      (web/server/api/projects/[project]/issues). Both serve them; the router sends only their `GET`s there, as
      writing an issue or a comment stays the Nuxt server's.
    - **Statuses** (ORR-926): the orrery's issue statuses (web/server/api/statuses). Served by both.
    - **Milestones and releases, reading** (ORR-926): a project's milestones and releases, one of each, and every
      project's releases (web/server/api/projects/[project]/milestones, releases, and web/server/api/releases.get.ts).
      Both serve them; the router sends only their `GET`s there, as writing them stays the Nuxt server's.

    An operation marked `x-served: false` is written ahead of the Rust API's: the router doesn't send it there yet, and
    the parity test holds it to that. The mark comes off in the pull request that serves it.

    Callers reach it at orrery's own address, as ever. The Nuxt server checks a request first (login or key, the board's
    permissions, the chat's and untrusted sessions' rails, the browser guards), then hands it to the Rust API when one is
    set up (`NUXT_API_BIN`, or `NUXT_API_URL` and `NUXT_API_TOKEN`). That hop, on loopback only, adds:

    - `Orrery-Api-Token`: the token both were given; anything else is a 401.
    - `Orrery-Database`: the SHA-256 of the database setting the Nuxt server is on; another is a 421, and the Nuxt
      server answers the request itself (the owner moved the database, and the API hasn't been started again on it).
    - `Orrery-Actor-Name`, `Orrery-Actor-Owner` (`1` or `0`), `Orrery-Actor-Session`: who's asking, as the Nuxt server
      worked it out; the name and session percent-encoded.

    A write's reply carries back what it changed, which the Nuxt server tells as its store would (open pages read the
    project again; the event log and schedules hear the event), and strips:

    - `Orrery-Changed`: the projects, comma-separated, each percent-encoded (a status change is every project's).
    - `Orrery-Settings`: `1` when the orrery's settings changed, as the statuses are in them: open pages get them again.
    - `Orrery-Told`: `<type> <project> <subject>`, comma-separated, each part percent-encoded (`doc.created`,
      `doc.changed`, `doc.deleted`).

    Not here: an artifact's page (`GET …/docs/{doc}/artifact`), which the Nuxt server keeps, as it's drawn with the
    page's sanitising and locked-down headers.
servers:
  - url: http://localhost:9000
paths:
  /api/projects/{project}/docs:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: The project's docs, without their text but with a summary
      description: Title hits first, then A–Z by title (ignoring case and accents, numbers by value), then by id.
      parameters:
        - name: q
          in: query
          description: Words every doc listed has, in its title or text, any case; each gets a `match`.
          schema: {type: string}
      responses:
        '200': {description: The docs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DocSummary'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Makes a doc
      description: |
        Its id is the one given, else the title as one (`How joints work` → `how-joints-work`), numbered when taken
        (`how-joints-work-2`). Kept as its first revision. Tells `doc.created`.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocInput'}}}}
      responses:
        '201': {description: The new doc, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/docs/{doc}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/doc'}]
    get:
      summary: A doc with its text
      responses:
        '200': {description: The doc, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      summary: Makes the doc at this id, or replaces its title and text
      description: |
        How a repo's Markdown file is kept in sync. `body` left out is empty; `section` left out keeps the one it has.
        Another board's full id is a 404, not a new doc.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocInput'}}}}
      responses:
        '200': {description: Replaced, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '201': {description: Made, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Changes a doc
      description: |
        Only a change to its title or text is a revision, and tells `doc.changed`; a new position or section isn't, and
        leaves `updated_at`. Its id and kind don't change.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocChange'}}}}
      responses:
        '200': {description: The doc, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: Deletes a doc, keeping its last text as a revision it can come back from
      description: One the owner made is theirs to delete. Tells `doc.deleted`.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/docs/{doc}/revisions:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/doc'}]
    get:
      summary: A doc's revisions, newest first, without their text; a deleted doc's too
      responses:
        '200': {description: The revisions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DocRevisionSummary'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/docs/{doc}/revisions/{revision}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/doc'}, {$ref: '#/components/parameters/revision'}]
    get:
      summary: A revision with its text
      responses:
        '200': {description: The revision, content: {application/json: {schema: {$ref: '#/components/schemas/DocRevision'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/docs/{doc}/revisions/{revision}/restore:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/doc'}, {$ref: '#/components/parameters/revision'}]
    post:
      summary: Puts a revision's title and text back, as a new revision
      description: |
        On a deleted doc it comes back where it was filed, with who made it (so the owner's stays theirs), and tells
        `doc.created`. The same text it has already changes nothing.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '200': {description: Restored onto the doc, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '201': {description: The deleted doc brought back, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/deleted-docs:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: The project's docs that are gone and can come back, the latest removed first
      responses:
        '200': {description: The deleted docs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DeletedDoc'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/doc-sections:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: The project's doc sections, as arranged, then the rest A–Z
      description: The ones docs are filed under, and empty ones made.
      responses:
        '200': {description: The sections' names, content: {application/json: {schema: {type: array, items: {type: string}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Makes a section with no docs in it yet, at the end of the list
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SectionName'}}}}
      responses:
        '201': {description: Made, content: {application/json: {schema: {$ref: '#/components/schemas/SectionName'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/doc-sections/{section}:
    parameters:
      - {$ref: '#/components/parameters/project'}
      - {name: section, in: path, required: true, description: The section's name, schema: {type: string}}
    patch:
      summary: Renames a section on every doc in it, or moves it in the list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 60}
                position: {type: integer, minimum: 0, description: 0 the top; past the end is the end}
      responses:
        '200': {description: Its name now, content: {application/json: {schema: {$ref: '#/components/schemas/SectionName'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      summary: Deletes a section; its docs are kept, filed under none
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/statuses:
    get:
      summary: The issue statuses, in board order
      description: By kind (backlog, todo, started, done, canceled), then by position, then by id. Every board has them.
      responses:
        '200': {description: The statuses, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Status'}}}}}
    post:
      summary: Adds a status, the owner's only
      description: Its id is the one given, else the name as one; `proposed` is taken by proposals. With no position it goes last. Every project changes, and the settings.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusInput'}}}}
      responses:
        '201': {description: The new status, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/statuses/{status}:
    parameters:
      - {name: status, in: path, required: true, description: The status's id, schema: {type: string}}
    patch:
      summary: Renames, recolours or moves a status, or gives it another kind, the owner's only
      description: Its id stays. The last status of a kind keeps its kind (409).
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusInput'}}}}
      responses:
        '200': {description: The status now, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      summary: Removes a status, the owner's only
      description: Its issues, schedules and signals move to `into`, which it needs while any issue or schedule is in it (409). The last status of a kind stays (409).
      parameters:
        - {$ref: '#/components/parameters/actor'}
        - {name: into, in: query, description: The status its issues and schedules move to, schema: {type: string}}
      responses:
        '204': {description: Removed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/issues:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: Every issue, sub-issues included, as a flat list in board order
      description: |
        Board order is each milestone in turn (by position, then when made), then the issues in no milestone; within
        each, an issue comes before its sub-issues, depth first, each level by position, then when made.

        Each filter given narrows the list; one left out or empty doesn't. `none` asks for issues without the field
        where the parameter says so. A milestone, parent or release that isn't there is a 404, as in its other routes.
      parameters:
        - {name: status, in: query, description: 'Status ids or kinds (`started`, `todo`, …), comma-separated; the old names of kinds count too', schema: {type: string}}
        - {name: priority, in: query, description: '`P0` to `P3`, or `none`', schema: {type: string}}
        - {name: column, in: query, description: 'The column it shows in: a status id or kind, or `proposed`', schema: {type: string}}
        - {name: assignee, in: query, description: 'A name, `owner` for the owner whatever their name, or `none`', schema: {type: string}}
        - {name: label, in: query, description: One label it has, exactly, schema: {type: string}}
        - {name: external, in: query, description: 'A task on the team''s tracker it names, exactly (`ENG-1567`)', schema: {type: string}}
        - {name: github_issue, in: query, description: 'A GitHub issue it came from: `523` on the project''s repo, `owner/name#523` or its link; any case', schema: {type: string}}
        - {name: milestone, in: query, description: 'A milestone''s id, an alias or full id of one, or `none`', schema: {type: string}}
        - {name: release, in: query, description: 'A release''s version, or `none`; 400 when the project has no releases', schema: {type: string}}
        - {name: parent, in: query, description: 'An issue''s id (an alias or full id finds it), for its sub-issues one level down; `none` for top-level ones', schema: {type: string}}
        - {name: proposal, in: query, description: 'A proposal state (`pending`, …), or `none` for committed work', schema: {type: string}}
        - {name: blocked, in: query, description: '`true`: waiting on an issue not done yet (`blocked_by`); `false`: not', schema: {type: string, enum: ['true', 'false']}}
        - {name: q, in: query, description: 'In the id or title, any case. With `in=all`, every word, anywhere: see `in`', schema: {type: string}}
        - name: in
          in: query
          description: |
            `all`: every word of `q` in its id and title, its description or a comment not orrery's own. Those with
            them in the id and title come first; then the rest, each with `match_in` and, unless it's labelled
            `external`, `match`.
          schema: {type: string, enum: [all]}
      responses:
        '200': {description: The issues, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/IssueRecord'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/issues/{issue}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/issue'}]
    get:
      summary: The issue with its column, counts and sub-issues, nested
      responses:
        '200': {description: The issue, content: {application/json: {schema: {$ref: '#/components/schemas/IssueDetail'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/issues/{issue}/comments:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/issue'}]
    get:
      summary: The issue's comments, oldest first
      responses:
        '200': {description: The comments, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Comment'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/issues/{issue}/comments/{comment}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/issue'}, {$ref: '#/components/parameters/comment'}]
    get:
      summary: One comment
      responses:
        '200': {description: The comment, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        '404': {description: 'No such project, issue or comment, a comment''s id that isn''t a whole number included', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/projects/{project}/milestones:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: The project's milestones in order, each with its column, counts and top-level issues by id
      responses:
        '200': {description: The milestones, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Milestone'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/milestones/{milestone}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/milestone'}]
    get:
      summary: The milestone with its issues, nested
      responses:
        '200': {description: The milestone, content: {application/json: {schema: {$ref: '#/components/schemas/MilestoneDetail'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/releases:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: 'The project''s releases (its source''s, when it takes them from another), as arranged, each with how far its issues are; none with releases off'
      responses:
        '200': {description: The releases, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Release'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/releases/{release}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/release'}]
    get:
      summary: 'The release with the issues set for it: the project''s own as `tasks`, and by project in `projects`, with those drawing on it when it''s their source'
      responses:
        '200': {description: The release, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseDetail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/releases:
    get:
      summary: Every project with releases of its own, with the projects drawing on it and their releases without notes, each with every project's part
      responses:
        '200': {description: The projects' releases, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProjectReleases'}}}}}
components:
  parameters:
    project: {name: project, in: path, required: true, description: The project's id, schema: {type: string}}
    doc: {name: doc, in: path, required: true, description: 'The doc''s id, or its full id on this board (`doc-ideas-x7k2m3qd`)', schema: {type: string}}
    revision: {name: revision, in: path, required: true, description: 'A revision''s id; ids run across the orrery', schema: {type: integer, minimum: 1}}
    issue: {name: issue, in: path, required: true, description: 'The issue''s id (`ORR-12`), an id it had before (an alias), or the full form of either on this board (`ORR-12-x7k2m3qd`)', schema: {type: string}}
    milestone: {name: milestone, in: path, required: true, description: 'The milestone''s id (`3`), an id it had before, or the full form of either on this board (`mls-3-x7k2m3qd`)', schema: {type: string}}
    release: {name: release, in: path, required: true, description: The release's version, schema: {type: string}}
    comment: {name: comment, in: path, required: true, description: 'A comment''s id; ids run across the orrery', schema: {type: integer, minimum: 1}}
    actor:
      name: Orrery-Actor
      in: header
      description: Who's writing; the owner's name writes as the owner. With login on, the credential decides.
      schema: {type: string, maxLength: 60}
  responses:
    BadRequest: {description: 'The body is wrong: `data.problems` says each thing', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: 'The owner''s call: `data.permission` names the row that says so', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: 'No such project, doc, revision, section, issue, comment, milestone or release', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Taken already, or not the same kind, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    DocKind: {type: string, enum: [markdown, artifact], description: '`artifact`: its text is HTML, only drawn in a sandboxed frame. Fixed when it''s made.'}
    DocInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$'}
        title: {type: string, minLength: 1, description: Trimmed; not only spaces}
        body: {type: string, description: Markdown, or HTML for an artifact}
        position: {type: number}
        section: {type: [string, 'null'], description: Trimmed to 60 characters; empty or null is none}
        kind: {$ref: '#/components/schemas/DocKind'}
    DocChange:
      type: object
      additionalProperties: false
      description: A doc's fields, all optional; `id` and `kind` only as they are.
      properties:
        id: {type: string}
        title: {type: string, minLength: 1}
        body: {type: string}
        position: {type: number}
        section: {type: [string, 'null']}
        kind: {$ref: '#/components/schemas/DocKind'}
    DocSummary:
      type: object
      required: [id, title, kind, summary, created_by, protected, created_at, updated_at]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {$ref: '#/components/schemas/DocKind'}
        summary: {type: string, description: 'Its first paragraph as plain text, cut to about 160 characters; empty for an artifact'}
        match: {type: string, description: 'With `q`: the text around its first hit; empty when only the title has it'}
        section: {type: string, description: Left out when it's under none}
        created_by: {type: string}
        protected: {type: boolean, description: The owner made it}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Doc:
      allOf:
        - $ref: '#/components/schemas/DocSummary'
        - type: object
          required: [project, body, full_id]
          properties:
            project: {type: string}
            body: {type: string}
            full_id: {type: string, description: 'Its id to paste anywhere: `doc-<id>-<the board''s uid>`'}
    DocRevisionSummary:
      type: object
      required: [id, title, kind, deleted, created_by, created_at]
      properties:
        id: {type: integer}
        title: {type: string}
        kind: {$ref: '#/components/schemas/DocKind'}
        deleted: {type: boolean, description: The doc being removed here; this holds its last text}
        created_by: {type: string}
        session_name: {type: string, description: The session that wrote it, by its name then}
        created_at: {type: string, format: date-time}
    DocRevision:
      allOf:
        - $ref: '#/components/schemas/DocRevisionSummary'
        - type: object
          required: [project, doc, body]
          properties:
            project: {type: string}
            doc: {type: string}
            body: {type: string}
    DeletedDoc:
      type: object
      required: [id, title, kind, summary, revision, deleted_by, deleted_at]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {$ref: '#/components/schemas/DocKind'}
        summary: {type: string}
        revision: {type: integer, description: The revision that says it was removed}
        deleted_by: {type: string}
        deleted_at: {type: string, format: date-time}
    SectionName:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 60, description: Trimmed; not empty}
    Status:
      type: object
      required: [id, name, kind, color, position]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {$ref: '#/components/schemas/StatusKind'}
        color: {type: string, description: 'A named tint (slate, blue, teal, green, amber, rose, violet) or `#rrggbb`'}
        position: {type: number}
    StatusKind: {type: string, enum: [backlog, todo, started, done, canceled]}
    StatusInput:
      type: object
      description: '`name` and `kind` are required to add one; a change sends any of them. Unknown fields are refused.'
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$'}
        name: {type: string, minLength: 1}
        kind: {$ref: '#/components/schemas/StatusKind'}
        color: {type: string, pattern: '^(slate|blue|teal|green|amber|rose|violet|#[0-9a-fA-F]{6})$'}
        position: {type: number}
    Asks: {type: string, enum: [decision, feedback], description: What a question waits on the owner for}
    Counts: {type: object, additionalProperties: {type: integer}, description: 'How many leaf issues are in each column, by its id; only columns with some'}
    Kinds:
      type: object
      description: How many leaf issues are of each kind of column, every kind listed
      required: [backlog, todo, started, done, canceled, proposed]
      properties:
        backlog: {type: integer}
        todo: {type: integer}
        started: {type: integer}
        done: {type: integer}
        canceled: {type: integer}
        proposed: {type: integer}
    Place: {type: string, enum: [backlog, todo, started, done, canceled, proposed], description: What a column means}
    Choice:
      type: object
      description: A question on a proposal, for the owner to pick from; stored and handed back as written
      additionalProperties: true
    PullRisk:
      type: object
      required: [level, why, by]
      properties:
        level: {type: string, enum: [low, medium, high]}
        why: {type: string}
        by: {type: string, enum: [owner, session]}
    Issue:
      type: object
      description: |
        An issue as the board draws it. Its column comes from its sub-issues' when it has any: closed when every
        committed one is (its first done status with some, else canceled), else the least-along open status any is in;
        `proposed` when it is a proposal or under one. Fields marked "only with some" are left out rather than empty.
      required: [id, title, labels, external, github_issues, status, choices, column, kind, counts, kinds, comments, aliases, created_by, protected, created_at, updated_at]
      properties:
        id: {type: string}
        title: {type: string}
        priority: {type: string, enum: [P0, P1, P2, P3]}
        assignee: {type: string, description: 'A person''s id, or `claude`'}
        labels: {type: array, items: {type: string}}
        external: {type: array, items: {type: string}}
        github_issues: {type: array, items: {type: string}, description: 'Each `owner/name#523`'}
        status: {type: string, description: Its own status as written; a parent's columns come from its sub-issues}
        notes: {type: string}
        proposal: {type: string, enum: [pending, approved, changes, rejected]}
        decided_by: {type: string}
        decided_at: {type: string, format: date-time}
        decision_note: {type: string}
        choices: {type: array, items: {$ref: '#/components/schemas/Choice'}}
        picks: {type: object, additionalProperties: {type: array, items: {type: string}}}
        explore: {type: object, required: [choice, option], properties: {choice: {type: string}, option: {type: string}}}
        column: {type: string}
        kind: {$ref: '#/components/schemas/Place'}
        counts: {$ref: '#/components/schemas/Counts'}
        kinds: {$ref: '#/components/schemas/Kinds'}
        comments: {type: integer}
        waiting:
          allOf: [{$ref: '#/components/schemas/Asks'}]
          description: |
            Its latest question from an agent with no comment of the owner's after it; else `decision` for a pending
            proposal an agent made that isn't under another proposal. Never on one that's done or canceled.
        aliases: {type: array, items: {type: string}, description: 'Ids it had before, A–Z'}
        schedule: {type: integer}
        release: {type: string}
        model: {type: string, description: Only with one}
        effort: {type: string, description: Only with one}
        created_by: {type: string}
        session_name: {type: string, description: Only with one}
        claimed_by: {type: string, description: Only with one}
        claimed_at: {type: string, format: date-time, description: Only with `claimed_by`}
        protected: {type: boolean, description: Made by the owner}
        depends_on: {type: array, items: {type: string}, description: 'Only with some: `ID` here, `project/ID` in another, in the order linked'}
        blocked_by: {type: array, items: {type: string}, description: 'Only with some: those of `depends_on` not done (a proposal isn''t done)'}
        blocks: {type: array, items: {type: string}, description: 'Only with some: the issues that depend on it'}
        risk: {allOf: [{$ref: '#/components/schemas/PullRisk'}], description: 'Only once a PR is rated: its riskiest'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    IssueRecord:
      description: An issue in a list, flat
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [project, ref, full_id, parent, milestone, sub_issues]
          properties:
            project: {type: string}
            ref: {type: string, description: '`orrery-<handle>: <id>`, the handle being the setting''s, else the owner''s id'}
            full_id: {type: string, description: '`ORR-12-x7k2m3qd`: its id with the project''s uid'}
            parent: {type: [string, 'null']}
            milestone: {type: [string, 'null'], description: 'The milestone it''s in, a sub-issue''s being its top-level issue''s'}
            sub_issues: {type: array, items: {type: string}, description: Its sub-issues one level down, by id, in board order}
            match_in: {type: string, enum: [description, comment], description: 'Only from `in=all`, when the words aren''t in its id and title'}
            match: {type: string, description: 'Only with `match_in`, and not on an `external` one: up to 60 characters before the first word and 100 after, cut at spaces, `…` where cut'}
    IssueDetail:
      description: One issue, its sub-issues nested in `tasks`
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [project, ref, full_id, parent, milestone, tasks]
          properties:
            project: {type: string}
            ref: {type: string}
            full_id: {type: string}
            parent: {type: [string, 'null']}
            milestone: {type: [string, 'null']}
            tasks: {type: array, items: {$ref: '#/components/schemas/Issue'}, description: 'Each with its own `tasks`, to any depth'}
    Milestone:
      type: object
      description: A milestone as the board draws it, its column rolled up from its issues as an issue's is from its sub-issues'
      required: [id, title, column, kind, counts, kinds, aliases, created_by, protected, project, position, created_at, updated_at, issues]
      properties:
        id: {type: string}
        title: {type: string}
        summary: {type: string, description: Only with one}
        priority: {type: string, enum: [P0, P1, P2, P3]}
        column: {type: string}
        kind: {$ref: '#/components/schemas/Place'}
        counts: {$ref: '#/components/schemas/Counts'}
        kinds: {$ref: '#/components/schemas/Kinds'}
        aliases: {type: array, items: {type: string}, description: 'Ids it had before, A–Z'}
        created_by: {type: string}
        protected: {type: boolean}
        project: {type: string}
        position: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        issues: {type: array, items: {type: string}, description: Its top-level issues by id, in board order}
    MilestoneDetail:
      description: One milestone, its issues in full
      allOf:
        - $ref: '#/components/schemas/Milestone'
        - type: object
          required: [tasks, full_id]
          properties:
            tasks: {type: array, items: {$ref: '#/components/schemas/Issue'}}
            full_id: {type: string, description: '`mls-3-x7k2m3qd`: its id with the project''s uid'}
    Release:
      type: object
      description: 'A release, with `issues` those set for it (a sub-issue''s when it differs from its parent''s) and `kinds` the leaves under them'
      required: [version, created_by, protected, created_at, updated_at, issues, kinds]
      properties:
        version: {type: string}
        branch: {type: string}
        notes: {type: string}
        frozen_on: {type: string}
        shipped_on: {type: string}
        doc_mark: {type: integer, description: 'The newest doc revision when it shipped'}
        created_by: {type: string}
        protected: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        issues: {type: integer}
        kinds: {$ref: '#/components/schemas/Kinds'}
    ReleaseDetail:
      allOf:
        - $ref: '#/components/schemas/Release'
        - type: object
          required: [project, tasks, projects]
          properties:
            project: {type: string}
            tasks: {type: array, items: {$ref: '#/components/schemas/Issue'}}
            projects:
              type: array
              items:
                type: object
                required: [project, name, issues, kinds, tasks]
                properties:
                  project: {type: string}
                  name: {type: string}
                  issues: {type: integer}
                  kinds: {$ref: '#/components/schemas/Kinds'}
                  tasks: {type: array, items: {$ref: '#/components/schemas/Issue'}}
    ProjectReleases:
      type: object
      required: [project, projects, releases]
      properties:
        project: {type: string}
        projects: {type: array, items: {type: string}, description: 'It, then those drawing on it, A–Z'}
        releases:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Release'
              - type: object
                required: [projects]
                properties:
                  projects: {type: array, items: {type: object, required: [project, issues, kinds], properties: {project: {type: string}, issues: {type: integer}, kinds: {$ref: '#/components/schemas/Kinds'}}}}
    Comment:
      type: object
      required: [id, issue, body, created_by, protected, created_at, updated_at]
      properties:
        id: {type: integer}
        issue: {type: string}
        body: {type: string, description: Markdown}
        asks: {$ref: '#/components/schemas/Asks'}
        answered: {type: boolean, description: 'Only with `asks`: whether the owner has commented on the issue since'}
        schedule: {type: object, additionalProperties: true, description: 'A session''s request to make or change a schedule (ORR-458), with its state'}
        created_by: {type: string}
        session_name: {type: string, description: Only with one}
        protected: {type: boolean, description: Written by the owner}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Error:
      type: object
      required: [statusCode, statusMessage, message]
      properties:
        statusCode: {type: integer}
        statusMessage: {type: string}
        message: {type: string}
        data:
          type: object
          properties:
            problems: {type: array, items: {type: string}}
            permission: {type: string}
