openapi: 3.1.0
info:
  title: orrery API
  version: 1.0.0-rc.18 # the orrery release it was written against
  description: |
    The domains of orrery's HTTP API that move to the Rust API in api/, each written from the Nuxt server's routes
    first, as the contract both answer alike to (web/test/api-parity.test.ts holds them to it):

    - **Docs** (ORR-922): a project's docs, their sections and their revisions (web/server/api/projects/[project]/docs,
      doc-sections, deleted-docs). Served by both.
    - **Issues and comments** (ORR-927): the issue list with its filters, one issue, its comments and its activity
      (web/server/api/projects/[project]/issues), and making and deleting a comment. Both serve them; the router sends
      their `GET`s there, and a comment's `POST`, `PATCH` and `DELETE`, checking a session's claim on the issue first
      for an edit. Writing an issue stays the Nuxt server's, as a change wakes sessions. A new or edited comment's reply
      says what the Nuxt server passes on to the sessions and the owner's bell (`Orrery-Carry`, `Orrery-Notice`).
    - **Uploads** (ORR-927, ORR-1058): an image kept for Markdown (web/server/api/uploads), read back and passed on by
      the router as it came, and kept, a PNG or JPEG compressed as WebP where that's smaller (board/compress.rs, as
      web/server/utils/compress.ts does with sharp).
    - **Signals, reading** (ORR-1087): a project's signals, after an id or about an issue or milestone
      (web/server/api/projects/[project]/signals). Served here alone; writing them, their delivery, the stream and the
      listeners stay the Nuxt server's, as they set what each session is doing.
    - **Schedules, reading** (ORR-930): a project's schedules, one with its runs, every project's and those across
      projects (web/server/api/projects/[project]/schedules, schedules.get.ts, schedules/across). Served by both; making,
      changing and running them stays the Nuxt server's, as a run starts a session.
    - **Statuses** (ORR-926): the orrery's issue statuses (web/server/api/statuses). Served by both.
    - **Permissions** (ORR-1086): what each kind of session may do, the table in web/shared/permissions.ts as
      api/permissions.json holds it. Served here alone.
    - **Milestones and releases** (ORR-926, written in ORR-974): a project's milestones and releases, one of each,
      made, changed (a release frozen and shipped too) and deleted, and every project's releases
      (web/server/api/projects/[project]/milestones, releases, and web/server/api/releases.get.ts). Served by both; a
      milestone's focus stays the Nuxt server's, as it signals sessions.
    - **People, invites, keys and logins** (ORR-928): who's on this orrery, inviting them, and the keys and logins people
      hold (web/server/api/people, invites, keys, logins). Served by both, removing a person included, which unassigns
      their open issues and tells each. Logging in and out stay the Nuxt server's.
    - **Secrets, reading** (ORR-953): the orrery's secrets and their uses, never a value (web/server/api/secrets). Both
      serve them; the router sends only their `GET`s there. Setting, narrowing and deleting one, and egress, stay the
      Nuxt server's: the key that seals a value stays with the local app, and the API never sees a value in the clear.
    - **A pull request, reading, and its risk** (ORR-952): one PR as orrery keeps it, with the issues it's on, and
      rating an issue's PR's risk
      (web/server/api/pulls/[owner]/[name]/[number].get.ts). The other pull reads ask GitHub when what's kept is stale,
      which is the local app's to do. The poll's writes are written ahead, for the local app to call once the API is
      swapped in: keeping a PR on its issues, a repo's poll, its failure and history page, and letting go of what's done
      (ORR-952). Until then the poll writes through the Nuxt server.
    - **Presets** (ORR-949): the orrery's presets and a project's own (web/server/api/presets, and
      web/server/api/projects/[project]/presets). Served by both; seeding the ones orrery ships as it starts stays the
      Nuxt server's.
    - **The bell** (ORR-1005): agents' comments across projects with the proposals waiting on the owner, the status
      changes on their issues, and clearing them or marking them read (web/server/api/notices). Served by both; each
      person's bell is their own (ORR-658).
    - **Epics** (ORR-1004): every epic with its progress, one with its issues, and making, changing and deleting one
      (web/server/api/epics), and an epic's comments and a milestone's (web/server/api/epics/[epic]/comments,
      web/server/api/projects/[project]/milestones/[milestone]/comments). Served by both; an epic's focus, which signals
      sessions, stays the Nuxt server's.

    An operation marked `x-served: false` is written ahead of the Rust API's: the router doesn't send it there yet, and
    the parity test holds it to that. The mark comes off in the pull request that serves it.

    Callers reach it at orrery's own address, as ever. The Nuxt server checks a request first (login or key, the board's
    permissions, the chat's and untrusted sessions' rails, the browser guards), then hands it to the Rust API when one is
    set up (`NUXT_API_BIN`, or `NUXT_API_URL` and `NUXT_API_TOKEN`). That hop, on loopback only, adds:

    - `Orrery-Api-Token`: the token both were given; anything else is a 401.
    - `Orrery-Database`: the SHA-256 of the database setting the Nuxt server is on; another is a 421, and the Nuxt
      server answers the request itself (the owner moved the database, and the API hasn't been started again on it).
    - `Orrery-Actor-Name`, `Orrery-Actor-Owner` (`1` or `0`), `Orrery-Actor-Session`: who's asking, as the Nuxt server
      worked it out; the name and session percent-encoded. `Orrery-Actor-Kind` (`owner`, `session`, `chat` or
      `untrusted`): its kind, as the chat and an untrusted session may name the owner and aren't (ORR-952).
    - `Orrery-Who` (`browser` or `agent`), `Orrery-Who-Person` (percent-encoded), `Orrery-Who-Owner` (`1` or `0`): with
      login on, what the request's credential said, as the Nuxt server checked it. None with login off.
    - `Orrery-Login-Ways`: what the Nuxt server's settings say about getting in, comma-separated: `provider` with a
      login provider set up, `off` with ORRERY_AUTH=off. `Orrery-Origin`: the address the request came to,
      percent-encoded, for an invite's link.
    - `Orrery-Login`: the SHA-256 of the asking browser's login cookie, as the logins table keeps it; the cookie itself
      stays with the Nuxt server.

    A write's reply carries back what it changed, which the Nuxt server tells as its store would (open pages read the
    project again; the event log and schedules hear the event), and strips:

    - `Orrery-Changed`: the projects, comma-separated, each percent-encoded (a status change is every project's).
    - `Orrery-Settings`: `1` when the orrery's settings changed, as the statuses are in them: open pages get them again.
    - `Orrery-Epics`: `1` when the epics changed: open pages ask for them again.
    - `Orrery-Told`: `<type> <project> <subject>`, comma-separated, each part percent-encoded (`doc.created`,
      `doc.changed`, `doc.deleted`).

    Not here: an artifact's page (`GET …/docs/{doc}/artifact`), which the Nuxt server keeps, as it's drawn with the
    page's sanitising and locked-down headers.
servers:
  - url: http://localhost:9000
paths:
  /api/projects/{project}/docs:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: The project's docs, without their text but with a summary
      description: Title hits first, then A–Z by title (ignoring case and accents, numbers by value), then by id.
      parameters:
        - name: q
          in: query
          description: Words every doc listed has, in its title or text, any case; each gets a `match`.
          schema: {type: string}
      responses:
        '200': {description: The docs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DocSummary'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Makes a doc
      description: |
        Its id is the one given, else the title as one (`How joints work` → `how-joints-work`), numbered when taken
        (`how-joints-work-2`). Kept as its first revision. Tells `doc.created`.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocInput'}}}}
      responses:
        '201': {description: The new doc, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/docs/{doc}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/doc'}]
    get:
      summary: A doc with its text
      responses:
        '200': {description: The doc, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      summary: Makes the doc at this id, or replaces its title and text
      description: |
        How a repo's Markdown file is kept in sync. `body` left out is empty; `section` left out keeps the one it has.
        Another board's full id is a 404, not a new doc.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocInput'}}}}
      responses:
        '200': {description: Replaced, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '201': {description: Made, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Changes a doc
      description: |
        Only a change to its title or text is a revision, and tells `doc.changed`; a new position or section isn't, and
        leaves `updated_at`. Its id and kind don't change.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocChange'}}}}
      responses:
        '200': {description: The doc, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: Deletes a doc, keeping its last text as a revision it can come back from
      description: One the owner made is theirs to delete. Tells `doc.deleted`.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/docs/{doc}/revisions:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/doc'}]
    get:
      summary: A doc's revisions, newest first, without their text; a deleted doc's too
      responses:
        '200': {description: The revisions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DocRevisionSummary'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/docs/{doc}/revisions/{revision}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/doc'}, {$ref: '#/components/parameters/revision'}]
    get:
      summary: A revision with its text
      responses:
        '200': {description: The revision, content: {application/json: {schema: {$ref: '#/components/schemas/DocRevision'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/docs/{doc}/revisions/{revision}/restore:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/doc'}, {$ref: '#/components/parameters/revision'}]
    post:
      summary: Puts a revision's title and text back, as a new revision
      description: |
        On a deleted doc it comes back where it was filed, with who made it (so the owner's stays theirs), and tells
        `doc.created`. The same text it has already changes nothing.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '200': {description: Restored onto the doc, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '201': {description: The deleted doc brought back, content: {application/json: {schema: {$ref: '#/components/schemas/Doc'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/deleted-docs:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: The project's docs that are gone and can come back, the latest removed first
      responses:
        '200': {description: The deleted docs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DeletedDoc'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/doc-sections:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: The project's doc sections, as arranged, then the rest A–Z
      description: The ones docs are filed under, and empty ones made.
      responses:
        '200': {description: The sections' names, content: {application/json: {schema: {type: array, items: {type: string}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Makes a section with no docs in it yet, at the end of the list
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SectionName'}}}}
      responses:
        '201': {description: Made, content: {application/json: {schema: {$ref: '#/components/schemas/SectionName'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/doc-sections/{section}:
    parameters:
      - {$ref: '#/components/parameters/project'}
      - {name: section, in: path, required: true, description: The section's name, schema: {type: string}}
    patch:
      summary: Renames a section on every doc in it, or moves it in the list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 60}
                position: {type: integer, minimum: 0, description: 0 the top; past the end is the end}
      responses:
        '200': {description: Its name now, content: {application/json: {schema: {$ref: '#/components/schemas/SectionName'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      summary: Deletes a section; its docs are kept, filed under none
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/events/log:
    get:
      summary: 'The event log, newest first (ORR-1088): what orrery did, what went wrong and the changes to the roadmap; up to `limit` (200, 1000 at most)'
      description: '`level` one or more of error, warn, info, comma-separated; `kind` one, or every one under a name (`session`); `subject` what a change to the roadmap was to; `since` a time with its zone, or a day; `open=1` only those not resolved. A page''s error report (`POST`) stays the Nuxt server''s, which sends the line it makes to `PUT /api/events/log/lines`.'
      parameters:
        - {name: level, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string}}
        - {name: project, in: query, schema: {type: string}}
        - {name: subject, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string}}
        - {name: open, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: string}}
      responses:
        '200': {description: 'The lines', content: {application/json: {schema: {type: array, items: {type: object}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/events/log/lines:
    put:
      x-served: false
      summary: 'A line the local app made, written (ORR-1088): a page''s error report or its own, scrubbed of secrets'' values there. A repeat of one not resolved yet is a line too, but no news (`fresh` false)'
      description: 'Only the Nuxt server''s own call (`Orrery-Came: server`). Each line goes into the outbox as `event.logged`, with `fresh` beside it when it''s news, for open pages'' bells; every 200 lines, old ones go.'
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [level, kind, message], properties: {level: {type: string, enum: [error, warn, info]}, kind: {type: string}, project: {type: string}, subject: {type: string}, message: {type: string}, details: {type: object}, activity: {type: boolean}}}}}
      responses:
        '201': {description: 'The line, and whether it''s news', content: {application/json: {schema: {type: object, properties: {event: {type: object}, fresh: {type: boolean}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/events/log/prune:
    post:
      x-served: false
      summary: 'Lets old lines go (ORR-1088): info after 7 days, the rest after 30, and the oldest past 5000 changes to the roadmap and 5000 of the rest'
      description: 'Only the Nuxt server''s own call (`Orrery-Came: server`), on its start and every hour.'
      responses:
        '200': {description: 'How many went', content: {application/json: {schema: {type: object, properties: {pruned: {type: integer}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/events/log/{event}/resolve:
    parameters:
      - {name: event, in: path, required: true, schema: {type: string}}
    post:
      summary: 'Marks a line dealt with, and its repeats not resolved yet (ORR-1088): the next one like it is news again. An agent''s name is kept (`resolved_by`)'
      description: 'Each line it changed goes into the outbox as `event.logged`, for open pages'' bells.'
      responses:
        '200': {description: 'The line, resolved', content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/usage:
    get:
      summary: 'How often the owner used each counted feature, coldest first, for App settings'' Usage (ORR-881, ORR-1089); the owner''s alone'
      description: '`on` is the owner''s switch (`count_use`). The router writes what it gathered in memory first, and adds `allowed`, its own setting (`ORRERY_USAGE`), to the reply.'
      responses:
        '200': {description: 'The switch and the features', content: {application/json: {schema: {type: object, properties: {on: {type: boolean}, features: {type: array, items: {type: object, properties: {feature: {type: string}, label: {type: string}, last: {type: [string, 'null']}, days30: {type: integer}, days90: {type: integer}}}}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      x-served: false
      summary: 'The feature counts the local app gathered in memory, sent once a minute: each added to its day, and those over a year old dropped (ORR-1089)'
      description: 'Only the Nuxt server''s own call (`Orrery-Came: server`). A count that isn''t one refuses them all. While the owner has counting off (`count_use`), they''re dropped, not kept (ORR-1136).'
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [counts], properties: {counts: {type: array, items: {type: object, properties: {feature: {type: string}, day: {type: string}, count: {type: integer}}}}}}}}
      responses:
        '204': {description: Kept}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      summary: 'Forgets every feature count, as turning counting off offers to; the owner''s (settings.write)'
      responses:
        '204': {description: Forgotten}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/uploads:
    post:
      summary: Keeps an image for Markdown to show
      description: '`data` is the image in base64 (a `data:` URL works too), a PNG, JPEG, GIF or WebP of 10 MB at most; `name` gives the Markdown its alt text. A PNG or JPEG of 16 KB or more is kept as WebP when that''s smaller (quality 90 and 82), no wider than 2560 and turned as its EXIF says, losing its metadata; a JPEG WebP doesn''t shrink is written again as a JPEG when that is smaller. A body too big for the largest image is refused before it''s read (413).'
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [data], additionalProperties: false, properties: {data: {type: string}, name: {type: [string, 'null']}}}}}}
      responses:
        '201': {description: Where it's served and the Markdown that shows it, content: {application/json: {schema: {type: object, required: [id, type, size, url, markdown], properties: {id: {type: string}, type: {type: string, enum: [image/png, image/jpeg, image/gif, image/webp]}, size: {type: integer}, url: {type: string}, markdown: {type: string}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {description: The body is bigger than the largest image, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/uploads/{upload}:
    parameters: [{name: upload, in: path, required: true, description: The image's id, 24 hex digits, schema: {type: string}}]
    get:
      summary: An image kept for Markdown, as it was kept
      description: It never changes, so the browser keeps it, and it's only ever an image (`nosniff`, a sandboxing Content-Security-Policy).
      responses:
        '200': {description: The image, content: {image/png: {}, image/jpeg: {}, image/gif: {}, image/webp: {}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/signals/prune:
    post:
      x-served: false
      summary: 'Lets go of signals past 30 days, heard or not (ORR-1090)'
      description: 'Only the Nuxt server''s own call (`Orrery-Came: server`), with its daily clean-up.'
      responses:
        '200': {description: 'How many went', content: {application/json: {schema: {type: object, properties: {pruned: {type: integer}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/statuses:
    get:
      summary: The issue statuses, in board order
      description: By kind (backlog, todo, started, done, canceled), then by position, then by id. Every board has them.
      responses:
        '200': {description: The statuses, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Status'}}}}}
    post:
      summary: Adds a status, the owner's only
      description: Its id is the one given, else the name as one; `proposed` is taken by proposals. With no position it goes last. Every project changes, and the settings.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusInput'}}}}
      responses:
        '201': {description: The new status, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/statuses/{status}:
    parameters:
      - {name: status, in: path, required: true, description: The status's id, schema: {type: string}}
    patch:
      summary: Renames, recolours or moves a status, or gives it another kind, the owner's only
      description: Its id stays. The last status of a kind keeps its kind (409).
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusInput'}}}}
      responses:
        '200': {description: The status now, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      summary: Removes a status, the owner's only
      description: Its issues, schedules and signals move to `into`, which it needs while any issue or schedule is in it (409). The last status of a kind stays (409).
      parameters:
        - {$ref: '#/components/parameters/actor'}
        - {name: into, in: query, description: The status its issues and schedules move to, schema: {type: string}}
      responses:
        '204': {description: Removed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/permissions:
    get:
      summary: 'What each kind of session may do (web/shared/permissions.ts), so a session can ask before it tries and is refused'
      description: 'The table api/permissions.json holds, as written: the levels'' names, the kinds of session, and a row per thing a session might do, with each kind''s cell.'
      responses:
        '200': {description: 'The levels, the kinds and the rows', content: {application/json: {schema: {type: object, required: [levels, kinds, permissions], properties: {levels: {type: object, additionalProperties: {type: string}}, kinds: {type: object, additionalProperties: {type: string}}, permissions: {type: array, items: {type: object}}}}}}}
  /api/settings:
    get:
      summary: This orrery's own settings, every one that's stored
      description: |
        Its id (made the first time it's asked for, and kept), the statuses, and every setting, the machine's own
        (`terminal`, `starts`, `advanced`) too, each with its default when it isn't set. What only the running server
        knows, `environment` and `database`, is the Nuxt server's `GET /api/machine`, not this.
      responses:
        '200': {description: The settings, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
    patch:
      summary: Changes the settings, the owner's only
      description: |
        Only the fields sent change; null puts one back to its default. An empty prompt is none, a handle is kept
        lowercase, and `starts` and `work_kinds` are checked and kept as sent. The settings change, every project when
        `starts` did (`Orrery-Changed`), and `Orrery-Settings-Keys` says which were sent, for the event log.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsInput'}}}}
      responses:
        '200': {description: The settings now, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/projects/{project}/issues:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: Every issue, sub-issues included, as a flat list in board order
      description: |
        Board order is each milestone in turn (by position, then when made), then the issues in no milestone; within
        each, an issue comes before its sub-issues, depth first, each level by position, then when made.

        Each filter given narrows the list; one left out or empty doesn't. `none` asks for issues without the field
        where the parameter says so. A milestone, parent or release that isn't there is a 404, as in its other routes.
      parameters:
        - {name: status, in: query, description: 'Status ids or kinds (`started`, `todo`, …), comma-separated; the old names of kinds count too', schema: {type: string}}
        - {name: priority, in: query, description: '`P0` to `P3`, or `none`', schema: {type: string}}
        - {name: column, in: query, description: 'The column it shows in: a status id or kind, or `proposed`', schema: {type: string}}
        - {name: assignee, in: query, description: 'A name, `owner` for the owner whatever their name, or `none`', schema: {type: string}}
        - {name: label, in: query, description: One label it has, exactly, schema: {type: string}}
        - {name: external, in: query, description: 'A task on the team''s tracker it names, exactly (`ENG-1567`)', schema: {type: string}}
        - {name: github_issue, in: query, description: 'A GitHub issue it came from: `523` on the project''s repo, `owner/name#523` or its link; any case', schema: {type: string}}
        - {name: milestone, in: query, description: 'A milestone''s id, an alias or full id of one, or `none`', schema: {type: string}}
        - {name: release, in: query, description: 'A release''s version, or `none`; 400 when the project has no releases', schema: {type: string}}
        - {name: parent, in: query, description: 'An issue''s id (an alias or full id finds it), for its sub-issues one level down; `none` for top-level ones', schema: {type: string}}
        - {name: proposal, in: query, description: 'A proposal state (`pending`, …), or `none` for committed work', schema: {type: string}}
        - {name: blocked, in: query, description: '`true`: waiting on an issue not done yet (`blocked_by`); `false`: not', schema: {type: string, enum: ['true', 'false']}}
        - {name: q, in: query, description: 'In the id or title, any case. With `in=all`, every word, anywhere: see `in`', schema: {type: string}}
        - name: in
          in: query
          description: |
            `all`: every word of `q` in its id and title, its description or a comment not orrery's own. Those with
            them in the id and title come first; then the rest, each with `match_in` and, unless it's labelled
            `external`, `match`.
          schema: {type: string, enum: [all]}
      responses:
        '200': {description: The issues, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/IssueRecord'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Makes an issue, with the project's next id
      description: |
        Takes the same fields as an issue's edit (`PATCH …/issues/{issue}`), with a `title`: the router keeps one naming
        any other field for the Nuxt server, and one from a session, the chat or an untrusted session too, as their asks
        are rewritten or noted there. It's noted as `created` and told (`issue.created`). A proposal (`proposal: pending`)
        is the owner's. An agent's, with more than one person, goes under its person's issue only, and is theirs then
        (taken up when it's started), unless it's a proposal; one at the top stays nobody's, so it's refused (409) started,
        closed or given to anyone but the owner. Urgent open work made by the owner or a member (P0, not a proposal, not
        closed) comes back with `Orrery-Urgent`, for the Nuxt server to push it to the sessions.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [title], description: 'The fields `PATCH …/issues/{issue}` takes'}
      responses:
        '201': {description: The new issue, content: {application/json: {schema: {$ref: '#/components/schemas/IssueDetail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'An agent''s that the rails between people refuse', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    patch:
      summary: Makes one change to many issues
      description: |
        Each edited on its own, as `PATCH …/issues/{issue}` edits one, so one refused doesn't stop the rest. `set` takes
        only `status`, `priority`, `assignee`, `milestone`, `release` and `epic`; `labels` adds and takes off labels, each
        once, from what each issue has. Each id sent comes back once, in the order sent, with `error` saying why when it
        wasn't changed. The ones it makes urgent open work come back in `Orrery-Urgent`, apart by commas, for the Nuxt
        server to push them to the sessions.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, items: {type: string}}
                set:
                  type: object
                  additionalProperties: false
                  properties: {status: {type: string}, priority: {type: [string, 'null']}, assignee: {type: [string, 'null']}, milestone: {type: [string, 'null']}, release: {type: [string, 'null']}, epic: {type: [string, integer, 'null']}}
                labels: {type: object, properties: {add: {type: array, items: {type: string}}, remove: {type: array, items: {type: string}}}}
      responses:
        '200':
          description: How each went
          content:
            application/json:
              schema: {type: array, items: {type: object, required: [id, ok], properties: {id: {type: string}, ok: {type: boolean}, error: {type: string}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: Deletes many issues, each with its sub-issues and comments
      description: |
        Each on its own, as one is deleted, so one refused doesn't stop the rest. Each id sent comes back once, in the
        order sent, with `error` saying why when it wasn't deleted. One already gone with an issue above it in the
        list is ok.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [ids], properties: {ids: {type: array, minItems: 1, items: {type: string}}}}}}
      responses:
        '200':
          description: How each went
          content:
            application/json:
              schema: {type: array, items: {type: object, required: [id, ok], properties: {id: {type: string}, ok: {type: boolean}, error: {type: string}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/issues/{issue}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/issue'}]
    get:
      summary: The issue with its column, counts and sub-issues, nested
      responses:
        '200': {description: The issue, content: {application/json: {schema: {$ref: '#/components/schemas/IssueDetail'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Changes the issue's words, status, priority, assignee, where it sits, what it depends on and whether it's a proposal
      description: |
        Only its `title`, `status`, `plan`, `priority`, `assignee`, `notes`, `labels`, `external`, `github_issues`, `parent`,
        `milestone`, `release`, `epic`, `depends_on`, `proposal`, `choices`, `model`, `effort` and `position`: the router keeps
        an edit naming any other field for the Nuxt server, and a session's edit of the status (`status` or `plan`) too, as
        the session's lock on the issue is the Nuxt server's. `status` is a status's id, a kind (its first status) or an old
        word (`doing`, `now`, `next`, `later`); `plan` is the old way to say Todo (any plan) or Backlog (null). `assignee:
        owner` is the owner, and blank or null is nobody. Closing or reassigning it ends a claim on it; an agent on the rails
        that starts its person's issue claims it for them, and hands one on only back to the owner. `epic` is an epic's number, `EPC-1` or its full id, 404 for one there isn't. Null clears all but the title and position. A sub-issue is in its parent's milestone, so `parent` and
        `milestone` aren't sent together; `parent: null` lifts it to the top, into its root's milestone unless one is
        sent. An agent's, with more than one person, only on its person's issue or its own proposal, and under a parent
        that's its person's too; and, with `restrict_proposals`, not the status, plan, assignee or release of a proposal waiting
        on the owner.
        Each changed field goes to the activity and is told (`issue.<field>`), without a title's or a link's words.
        `depends_on` is all it depends on, ids here or `project/ID`, null or none to clear: refused for itself, its
        parent or a sub-issue, or one that already depends on it; the change is told as `issue.depends`. `proposal:
        pending` puts it to the owner: assigned to them, its last decision cleared, and a claim on it ended when that
        reassigns it. `proposal: null` commits it, refused (403) for anyone but the owner while it's a proposal. Made
        urgent open work by the owner or a member (P0, committed, not closed, and not urgent work before), the reply's `Orrery-Urgent` names it
        (`<project> <issue>`, percent-encoded), for the Nuxt server to push it to the sessions.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: {type: string, minLength: 1}
                status: {type: string, description: 'A status''s id, a kind (`backlog`, `todo`, `started`, `done`, `canceled`) or an old word (`doing`, `now`, `next`, `later`)'}
                plan: {type: [string, 'null'], enum: [now, next, later, null], description: 'From before statuses: any plan is Todo, null is Backlog'}
                priority: {type: [string, 'null'], enum: [P0, P1, P2, P3, null]}
                assignee: {type: [string, 'null'], description: 'Who it''s with: `owner` is the owner, blank or null is nobody'}
                notes: {type: [string, 'null']}
                labels: {type: [array, 'null'], items: {type: string}}
                external: {type: [array, 'null'], items: {type: string}}
                github_issues: {type: [array, 'null'], items: {type: [string, integer]}}
                parent: {type: [string, 'null'], description: An issue's id here, an alias or its full id}
                milestone: {type: [string, 'null'], description: A milestone's id, an alias or its full id}
                release: {type: [string, 'null'], description: The version of a release it ships in}
                epic: {type: [string, integer, 'null'], description: 'The epic it''s part of: its number, `EPC-1` or its full id'}
                depends_on: {type: [array, 'null'], items: {type: string}, description: 'All it depends on: `ID` here or `project/ID` in another'}
                proposal: {type: [string, 'null'], enum: [pending, null], description: '`pending` puts it (back) to the owner; null commits it, the owner''s alone'}
                choices: {type: [array, 'null'], items: {type: object}, description: 'A proposal''s questions for the owner: `{key, question, pick?, options: [{key, title, body?}], recommended?, from?}`; null for none'}
                model: {type: [string, 'null']}
                effort: {type: [string, 'null'], enum: [low, medium, high, xhigh, max, null]}
                position: {type: number}
      responses:
        '200': {description: The issue, content: {application/json: {schema: {$ref: '#/components/schemas/IssueDetail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'It isn''t the session''s person''s, or the session names nobody', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      summary: Deletes the issue, its sub-issues and comments with it
      description: |
        An agent's, with more than one person, only when every issue in it is its person's, and never what the owner
        made. What names them without a foreign key lets go of them: their signals and links go, a schedule's runs keep
        no issue, and each issue that depended on one is told it no longer does (`issue.depends`).
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'One in it isn''t the session''s person''s, or the session names nobody', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/projects/{project}/issues/{issue}/claim:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/issue'}]
    post:
      summary: Takes the issue up for whoever's asking
      description: |
        A person's own, or one that's nobody's, which it assigns to them; the owner's on anyone's, which takes it over.
        With more than one person, an agent takes up only its person's. The claim and a new assignee show in the activity.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '200': {description: The issue, content: {application/json: {schema: {$ref: '#/components/schemas/IssueDetail'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Someone else holds it, it was reassigned meanwhile, or the session names nobody', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      summary: Lets go of the issue's claim, which leaves it assigned
      description: The holder's to let go, or the owner's on anyone's. One nobody has claimed is as it was.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '200': {description: The issue, content: {application/json: {schema: {$ref: '#/components/schemas/IssueDetail'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Someone else holds it, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/projects/{project}/issues/decide:
    parameters: [{$ref: '#/components/parameters/project'}]
    post:
      summary: The owner's one decision on many proposals
      description: |
        Each decided on its own, as `POST …/issues/{issue}/decide` decides one, so one refused doesn't stop the rest.
        Picks and explore go one at a time: approving takes each one's recommendations, and refuses one with a choice
        that has none. Each id sent comes back once, in the order sent, with `error` saying why when it wasn't decided.
        Each comment comes back in `Orrery-Carry` and the ones approving made urgent in `Orrery-Urgent`, apart by commas.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, decision]
              properties:
                ids: {type: array, minItems: 1, items: {type: string}}
                decision: {type: string, enum: [approved, changes, rejected]}
                note: {type: [string, 'null']}
      responses:
        '200':
          description: How each went
          content:
            application/json:
              schema: {type: array, items: {type: object, required: [id, ok], properties: {id: {type: string}, ok: {type: boolean}, error: {type: string}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/issues/{issue}/decide:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/issue'}]
    post:
      summary: The owner's decision on a proposal
      description: |
        Approving commits it, into Todo while it's in the backlog, with the picks sent or each choice's recommendation;
        asking for changes can name an option to go further down (`explore`); a rejection is told to the session on it
        but starts no work. It goes back to whoever proposed it, and the decision is left on it as the owner's comment,
        which comes back in `Orrery-Carry` (marked ` quiet` for a rejection) for the Nuxt server to pass on, with
        `Orrery-Urgent` when approving made it urgent open work.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: {type: string, enum: [approved, changes, rejected]}
                note: {type: [string, 'null']}
                picks: {type: object, additionalProperties: {type: array, items: {type: string}}}
                explore: {type: object, required: [choice, option], properties: {choice: {type: string}, option: {type: string}}}
      responses:
        '200': {description: The issue, content: {application/json: {schema: {$ref: '#/components/schemas/IssueDetail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/issues/{issue}/comments:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/issue'}]
    get:
      summary: The issue's comments, oldest first
      responses:
        '200': {description: The comments, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Comment'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Comments on the issue
      description: |
        An agent's ask (`asks`) assigns the issue to the owner, and the owner's answer gives it back to the agent who
        asked; with people, an agent's ask waits on its own person, and only on an issue that's theirs. Tells
        `comment.added`, or `comment.asks` with `to`, and `issue.assignee` when it moved. The reply's `Orrery-Carry`
        (the owner's or a member's words) and `Orrery-Notice` (an agent's), each `<project> <issue> <comment>`, say what
        the Nuxt server passes on to the session on the issue and to the owner's bell.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentInput'}}}}
      responses:
        '201': {description: The new comment, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/issues/{issue}/activity:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/issue'}]
    get:
      summary: Who changed what on the issue, and when, oldest first
      responses:
        '200': {description: The changes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/IssueEvent'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/issues/{issue}/comments/{comment}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/issue'}, {$ref: '#/components/parameters/comment'}]
    get:
      summary: One comment
      responses:
        '200': {description: The comment, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        '404': {description: 'No such project, issue or comment, a comment''s id that isn''t a whole number included', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    patch:
      summary: Edits the comment's words or what it asks
      description: |
        The owner's is theirs to edit, and a member's (or their agents') theirs or the owner's. The Nuxt server refuses a
        session first while another session is working on the issue. New words by the comment's own person come back in
        `Orrery-Carry` (`<project> <issue> <comment> edited`), for the Nuxt server to pass on to the session on the issue.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommentEdit'}}}}
      responses:
        '200': {description: The comment, content: {application/json: {schema: {$ref: '#/components/schemas/Comment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'No such project, issue or comment, a comment''s id that isn''t a whole number included', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      summary: Deletes the comment
      description: The owner's is theirs to delete, and a member's (or their agents') theirs or the owner's.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'No such project, issue or comment, a comment''s id that isn''t a whole number included', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/projects/{project}/milestones:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: The project's milestones in order, each with its column, counts and top-level issues by id
      responses:
        '200': {description: The milestones, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Milestone'}}}}}
    post:
      summary: Makes a milestone with the project's next number
      description: Told as `milestone.created`. One the owner makes is theirs to delete.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MilestoneInput'}}}}
      responses:
        '201': {description: The milestone, content: {application/json: {schema: {$ref: '#/components/schemas/MilestoneDetail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/milestones/{milestone}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/milestone'}]
    get:
      summary: The milestone with its issues, nested
      responses:
        '200': {description: The milestone, content: {application/json: {schema: {$ref: '#/components/schemas/MilestoneDetail'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Changes a milestone's title, summary, priority or position
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MilestoneInput'}}}}
      responses:
        '200': {description: The milestone now, content: {application/json: {schema: {$ref: '#/components/schemas/MilestoneDetail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: Deletes a milestone; its issues stay, in no milestone
      description: Its signals go, and schedules that made issues in it make them in none. One the owner made is theirs to delete (403).
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/releases:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: 'The project''s releases (its source''s, when it takes them from another), as arranged, each with how far its issues are; none with releases off'
      responses:
        '200': {description: The releases, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Release'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Makes a release, at the top of the project's unless `position` places it
      description: Told as `release.created`. Made shipped, it marks the docs as they are. One the owner makes is theirs to delete. Refused (400) on a project with no releases of its own.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseInput'}}}}
      responses:
        '201': {description: The release, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseDetail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/releases/{release}:
    parameters: [{$ref: '#/components/parameters/project'}, {$ref: '#/components/parameters/release'}]
    get:
      summary: 'The release with the issues set for it: the project''s own as `tasks`, and by project in `projects`, with those drawing on it when it''s their source'
      responses:
        '200': {description: The release, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseDetail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Changes a release's branch, notes, days or place; its version can't change
      description: 'Setting `frozen_on` or `shipped_on` is told as `release.frozen` or `release.shipped`, clearing it as `release.thawed` or `release.unshipped`; a new day on one already set is no event. Shipping marks the docs as they are, and un-shipping lets the mark go.'
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseInput'}}}}
      responses:
        '200': {description: The release now, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseDetail'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      summary: Deletes a release; its issues stay, set for no release, in the projects drawing on it too
      description: Told as `release.deleted`. One the owner made is theirs to delete (403).
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/releases:
    get:
      summary: Every project with releases of its own, with the projects drawing on it and their releases without notes, each with every project's part
      responses:
        '200': {description: The projects' releases, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProjectReleases'}}}}}
  /api/projects:
    get:
      summary: Every project, by name, each with its counts
      description: |
        Each project's own fields, docs, doc sections and releases, and for its board only the counts and kinds of its
        leaf issues and how many milestones it has. With `?expand=board` it's each one's board instead, trimmed by
        `&notes=0` and `&closed=0` but for the projects in `&whole=`. The events stream's `rev` isn't here: the router asks
        for the whole boards and labels them with it, then leaves the closed issues out itself.
      parameters:
        - {name: expand, in: query, required: false, description: '`board` gives each project''s board in place of its counts', schema: {type: string}}
        - {name: notes, in: query, required: false, description: '`0` leaves the issues'' notes out', schema: {type: string}}
        - {name: closed, in: query, required: false, description: '`0` leaves out the closed issues with no open sub-issue', schema: {type: string}}
        - {name: whole, in: query, required: false, description: 'Projects, comma-separated, whose boards keep their closed issues', schema: {type: string}}
      responses:
        '200': {description: 'The projects, with their counts or, expanded, their boards', content: {application/json: {schema: {type: array, items: {oneOf: [{$ref: '#/components/schemas/ProjectSummary'}, {$ref: '#/components/schemas/Project'}]}}}}}
    post:
      summary: Makes a project
      description: |
        `name` is needed. Its id is `id`, else the name as a slug, and its key is `key`, else three capitals from the
        name; a key a milestone's, an epic's, a doc's, a preset's or a schedule's id starts with is refused (400), and
        one made from a name steps past them (`EPCO` for Epcot). A taken id is a 409. It has no releases unless sent
        `release_mode` or `releases_from`; its prompts are the owner's (403). Whoever asks holds it: a session's person,
        the owner's chat the owner's.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses:
        '201': {description: 'The project, with its board', content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: The project, with its board
      description: |
        Its own fields, docs, doc sections, releases and board. `?notes=0` leaves the issues' notes out, and `?closed=0`
        the closed issues (done, canceled) with no open sub-issue under them. The events stream's `rev`, which the page's
        patches build on, isn't here: it's the Nuxt server's, so the router asks for the whole board and labels the reply
        with it, then leaves the closed issues out itself.
      parameters:
        - {name: notes, in: query, required: false, description: '`0` leaves the issues'' notes out', schema: {type: string}}
        - {name: closed, in: query, required: false, description: '`0` leaves out the closed issues with no open sub-issue', schema: {type: string}}
      responses:
        '200': {description: 'The project, with its board', content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Changes a project
      description: |
        Its name, key, description, icon, tint, repo and where its releases come from; its prompts (`focus_prompt`,
        `milestone_prompt`, `instructions`, `muted`) are the owner's (403). Its id can't change (400). Sending
        `releases_from` makes it `shared`, and null gives it its own; leaving its own releases is refused while it has
        some or another project draws on them (409). Its issues keep only the releases the new source has.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses:
        '200': {description: 'The project, with its board', content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      summary: Deletes a project, for good
      description: |
        Everything in it goes too: milestones, issues, comments, docs, releases, schedules and signals. An agent can't
        while it holds anything the owner made (403), and nobody can while another project takes its releases from it
        (409). The reply says its schedules changed (`Orrery-Schedules`), for the local app's runner to drop them.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/export:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: The board as one file
      description: |
        A snapshot of the project, read in one transaction, that leaves the board as it is: its rows of each table a board
        takes (`tables`), the people it names, the statuses its issues are in, and the images its text shows (`data` in
        base64). Secrets, credentials and live state stay behind. `Content-Disposition` names it for the project and the
        day, so a browser saves it. Whether the asker is on the board is the Nuxt server's to check, before it sends this on.
      responses:
        '200': {description: The board's file, content: {application/json: {schema: {type: object, required: [format, format_version, schema_step, exported_at, project, people, statuses, uploads, tables], properties: {format: {type: string, enum: [orrery-board]}, format_version: {type: integer}, schema_step: {type: integer}, exported_at: {type: string}, project: {type: string}, people: {type: array, items: {type: object}}, statuses: {type: array, items: {type: object}}, uploads: {type: array, items: {type: object}}, tables: {type: object}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/projects/{project}/import:
    parameters: [{$ref: '#/components/parameters/project'}]
    post:
      summary: Imports a roadmap
      description: |
        A roadmap in `docs/roadmap.json`'s format: milestones of tasks with a status (`todo`, `doing`, `done`) and a plan.
        Everything gets the project's ids (milestones 1, 2, …, issues KEY-1, …), the file's ids becoming aliases. A file
        with problems is a 400 naming each, with unknown fields among them. Refused when the project has milestones or
        issues already (409) unless `replace=true`, which clears them first; replacing what the owner made is theirs
        (403). With more than one person on this orrery, only a person imports one (409).
      parameters:
        - {$ref: '#/components/parameters/actor'}
        - {name: replace, in: query, required: false, description: '`true` clears the milestones and issues first', schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [milestones], properties: {$comment: {type: string}, milestones: {type: array, items: {type: object}}}}}}}
      responses:
        '200': {description: 'The project, with its board', content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/owner:
    get:
      summary: The owner
      description: Their id, which the page sends as `Orrery-Actor`, the name it shows for them, and whether they've given it yet (the page asks on first open). Before they have, both are `owner`.
      responses:
        '200': {description: The owner, content: {application/json: {schema: {$ref: '#/components/schemas/Owner'}}}}
    put:
      summary: Names the owner
      description: |
        `Sköll Fenrisson` makes the id `skoll_fenrisson`. Anyone may the first time; then only the owner (403). What was
        theirs under the old id (what they made, what's assigned to them, their decisions) moves to the new one. `agent`
        and `claude` are refused (400), and so is someone else's id (409).
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PersonInput'}}}}
      responses:
        '200': {description: The owner, named, content: {application/json: {schema: {$ref: '#/components/schemas/Owner'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/people:
    get:
      summary: Everyone on this orrery
      description: The owner first, then in the order they were added; those removed stay listed, with when. An id is what a session sets as `ORRERY_PERSON`.
      responses:
        '200': {description: The people, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Person'}}}}}
    post:
      summary: Adds a person, a member, the owner's only
      description: |
        Their id is the name in lowercase snake case, and never changes; one a removed person had stays theirs (409), and
        `owner`, `agent`, `claude` and `orrery` are what agents and orrery go by (400). The owner names themselves first
        (400). A second person turns login on, so it's refused (409) until someone could log in: a login provider, or the
        owner's person key, unless ORRERY_AUTH=off.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PersonInput'}}}}
      responses:
        '201': {description: The person, content: {application/json: {schema: {$ref: '#/components/schemas/Person'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/people/{person}:
    parameters:
      - {name: person, in: path, required: true, description: The person's id, schema: {type: string}}
    patch:
      summary: Renames a member, the owner's only
      description: Their id stays. The owner's own name is changed with `PUT /api/owner` (400); a removed person's stays (409).
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PersonInput'}}}}
      responses:
        '200': {description: The person, renamed, content: {application/json: {schema: {$ref: '#/components/schemas/Person'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      summary: Removes a member, the owner's only
      description: Their name stays on history. What they held goes to the owner, their keys are revoked, their logins and invites end, and their open issues go back to unassigned, each noted and told (`issue.assignee`). The owner can't be removed (400); one already removed is left as it is.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Removed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/invites:
    post:
      summary: Invites a person to attach their first login, the owner's only
      description: A link good once and for a week, at the address the request came to, whose first login through the provider attaches that account to the person. Only with a login provider (409).
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [person], properties: {person: {type: string, description: Who to invite, by id}}}}}}
      responses:
        '201': {description: The link, content: {application/json: {schema: {type: object, required: [url, expires_at], properties: {url: {type: string}, expires_at: {type: string, format: date-time}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/members:
    parameters: [{$ref: '#/components/parameters/project'}]
    get:
      summary: Who's on the board, its holder first, then in the order they joined
      responses:
        '200': {description: The members, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BoardMember'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Puts a person on the board, its holder's or the owner's to do
      description: By their id or their name. Never an agent's (403, members.write); a removed person can't be put on (409). One already on it stays as they are.
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [person], additionalProperties: false, properties: {person: {type: string, description: Who, by id or name}}}}}}
      responses:
        '201': {description: The member, content: {application/json: {schema: {$ref: '#/components/schemas/BoardMember'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/projects/{project}/members/{person}:
    parameters:
      - {$ref: '#/components/parameters/project'}
      - {name: person, in: path, required: true, description: The person's id, schema: {type: string}}
    delete:
      summary: Takes a person off the board, as adding does
      description: Its holder stays, as a board always has one (400).
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Taken off}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/keys:
    get:
      summary: The asking person's keys, or everyone's for the owner
      description: The newest first; a revoked one stays listed. Never a key's secret. A person in a browser, or with login off the owner by name; never a session, whatever key it has (403, keys.write).
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '200': {description: The keys, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Key'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Makes a key, with its secret this once only
      description: '`agent` goes in a machine''s ORRERY_KEY, and `person` signs in to the page. A person makes their own; `person` in the body is the owner''s to give, for handing someone a key on a server with no provider (403 for anyone else).'
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KeyInput'}}}}
      responses:
        '201': {description: The key, with `key`, content: {application/json: {schema: {$ref: '#/components/schemas/NewKey'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/keys/{key}:
    parameters:
      - {name: key, in: path, required: true, description: The key's id, schema: {type: string}}
    delete:
      summary: Revokes a key, at once
      description: With the logins it started. A person's own, or anyone's for the owner; another's is a 404. Revoking it again changes nothing.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Revoked}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/logins:
    get:
      summary: The asking person's live logins, or everyone's for the owner
      description: Each browser or phone signed in, the latest used first, with `current` on the one asking. Never what's in a cookie. Never a session's (403, logins.write).
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '200': {description: The logins, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Login'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      summary: Ends every login but the asking browser's
      description: A person's own, or everyone's for the owner. With login off there's no login to keep, so every one ends.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '200': {description: How many ended, content: {application/json: {schema: {type: object, required: [ended], properties: {ended: {type: integer}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/logins/{login}:
    parameters:
      - {name: login, in: path, required: true, description: 'The login''s id, as listed: 16 hex digits', schema: {type: string}}
    delete:
      summary: Ends a login at once
      description: A person's own, or anyone's for the owner; another's is a 404.
      parameters: [{$ref: '#/components/parameters/actor'}]
      responses:
        '204': {description: Ended}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/auth/login:
    post:
      summary: Swaps a person key for a login's cookie
      description: >-
        The body is `{key}`, a person key (an agent key can't sign in). Sets the http-only login cookie, named for the
        port in the address the browser asked for (`Orrery-Host` from the router, else `Host`: `orrery_login_9010`),
        `Secure` when the request came over https, for 30 days. The router passes its `Set-Cookie` back (ORR-1137).
      requestBody: {content: {application/json: {schema: {type: object, properties: {key: {type: string}}}}}}
      responses:
        '200': {description: Logged in, content: {application/json: {schema: {type: object, properties: {person: {type: string}}}}}}
        '401': {description: Not a live person key}
  /api/auth/logout:
    post:
      summary: Ends this browser's login, on the server as well as its cookie
      description: >-
        By the login hashed (`Orrery-Login`), as the router keeps the cookie; asked directly, by the cookie itself.
      responses:
        '204': {description: Logged out, or wasn't logged in}
  /api/auth/status:
    get:
      x-served: false
      summary: Whether this orrery asks for a login, and who this browser is
      description: >-
        Open, as the login page needs it first. How the request reached the router comes in `Orrery-Came` (`loopback`,
        `proxied`, `phone`, `https`), and `Orrery-Login-Ways` says `on` for ORRERY_AUTH=on. Written ahead of the swap.
      responses:
        '200': {description: '{mode, person?, via?, can_get_in, oidc, warn_http, phone}'}
  /api/auth/link:
    post:
      x-served: false
      summary: Signs this browser in with a phone's one-time link or its six-letter code, using it up
      description: >-
        `{token}` from the QR code, or `{code}` typed. The login is named as the phone's own. Five wrong codes in a row
        end every code still open. Links are kept in memory, so a restart ends them. Written ahead of the swap.
      responses:
        '201': {description: '{person}, with the login cookie'}
        '401': {description: The link or code is wrong, used or has run out}
  /api/phone/link:
    post:
      x-served: false
      summary: A one-time sign-in link and code for App settings' QR code
      description: >-
        Good once, for five minutes. Only the owner's own page makes one: never over the phone's port
        (`Orrery-Came: phone`), never a session, the chat or an untrusted one. Written ahead of the swap.
      responses:
        '201': {description: '{token, code, expires_at}'}
        '403': {description: Over the phone's port, or not the owner's own page}
        '409': {description: The owner hasn't given their name yet}
  /api/auth/oidc/start:
    get:
      x-served: false
      summary: Sends the browser to the login provider
      description: >-
        The authorization code flow with PKCE, found through the provider's discovery document (NUXT_OIDC_ISSUER,
        NUXT_OIDC_CLIENT_ID, NUXT_OIDC_CLIENT_SECRET). What the way back has to match is kept in the http-only
        `orrery_oidc` cookie for 10 minutes. Written ahead of the swap: the Nuxt server serves it until then.
      parameters:
        - {name: invite, in: query, description: An invite's secret, to attach a new account to its person, schema: {type: string}}
        - {name: back, in: query, description: 'The page''s origin, when NUXT_ALLOWED_ORIGINS lists it; any other is ignored', schema: {type: string}}
      responses:
        '302': {description: To the provider's login}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {description: The provider is set up wrong or didn't answer}
  /api/auth/oidc/callback:
    get:
      x-served: false
      summary: Logs the browser in from the provider's way back
      description: >-
        Checks the way back answers this browser's own login, swaps the code for an ID token and verifies it against the
        provider's keys. An account orrery doesn't know needs the invite the login started with. Clears `orrery_oidc`
        whatever comes of it. Written ahead of the swap.
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
      responses:
        '302': {description: 'Logged in: to the board, or to the listed origin it started from'}
        '401': {description: 'The way back doesn''t match, has run out, or the ID token doesn''t check out'}
        '403': {description: The account isn't on this orrery}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: The invite has been used or has run out, or the account belongs to someone else}
        '502': {description: The provider is set up wrong or didn't answer}
  /api/notices:
    get:
      summary: The bell, or one of the notifications page's lists
      description: |
        Agents' comments across projects. The `bell` is the latest 30 not cleared, those still waiting on the owner (a
        decision or feedback they haven't answered) first, with agents' proposals waiting on them ahead of all. The
        page's lists are newest first: `waiting` (every one, proposals among them), and `inbox` and `cleared` a page at a
        time, `limit` of them (50, at most 200) older than the notice `before`. With more than one person each has their
        own bell (ORR-658), and only the owner's has proposals.
      parameters:
        - {name: list, in: query, description: 'Which: `bell` (the default), `waiting`, `inbox` or `cleared`', schema: {type: string, enum: [bell, waiting, inbox, cleared]}}
        - {name: before, in: query, description: 'For `inbox` and `cleared`: only notices older than this comment', schema: {type: integer}}
        - {name: limit, in: query, description: 'For `inbox` and `cleared`: how many, 50 by default, at most 200', schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200': {description: The notices, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Notice'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/notices/changes:
    get:
      summary: Moves into done since a time on the issues in the asker's bell, oldest first
      description: The latest 2000, if there are more (ORR-803). Other status changes aren't news to them (ORR-1151).
      parameters:
        - {name: since, in: query, required: true, description: A time, schema: {type: string, format: date-time}}
      responses:
        '200': {description: The changes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NoticeChange'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/notices/clear:
    post:
      summary: Takes notices out of the bell
      description: |
        The comments stay on their issues, the proposals pending. Comments by `ids` and proposals by `{project, issue}`,
        every comment made at or before `before`, or every one `read`: the last two leave those still waiting on the
        owner. A member's clears are their own (no proposals); a session is refused (403).
      parameters: [{$ref: '#/components/parameters/actor'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
