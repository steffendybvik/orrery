  /api/pulls/{owner}/{name}/{number}:
    parameters:
      - {name: owner, in: path, required: true, description: The GitHub repo's owner, in any case, schema: {type: string}}
      - {name: name, in: path, required: true, description: The GitHub repo's name, in any case, schema: {type: string}}
      - {name: number, in: path, required: true, description: 'The PR''s number: `788` or `#788`', schema: {type: string}}
    get:
      summary: One pull request as orrery keeps it, with every issue it's on
      description: >-
        Merged and closed ones too: orrery keeps a PR that names an issue, and a release PR on every issue in its release.
        The issues come riskiest first, each with its riskiest rated PR. Anyone but the owner (`Orrery-Actor-Kind: owner`)
        gets the PR without its title and branch, which an outsider may have written, and its author only when it's a
        plain login.
      responses:
        '200':
          description: The pull request
          content:
            application/json:
              schema:
                type: object
                required: [repo, pull, issues]
                properties:
                  repo: {type: string, description: As asked}
                  pull: {$ref: '#/components/schemas/KeptPull'}
                  issues:
                    type: array
                    items:
                      type: object
                      required: [project, project_name, id, title, status]
                      properties:
                        project: {type: string}
                        project_name: {type: string}
                        id: {type: string}
                        title: {type: string}
                        status: {type: string}
                        risk: {$ref: '#/components/schemas/PullRisk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      x-served: false
      summary: Keeps the PR on each issue it names, and off any it no longer names
      description: >-
        What the local app's poll does with each PR it reads that changed (`remember`, ORR-795): `names` are the issue ids
        in its body and branch, looked up by id or an old one among `projects`, and a release PR (from a release's branch)
        is on every issue in that release too. It tells nobody: what a PR does next is the poll's news, told on its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projects, names, title, url, branch, base, author, merged, closed, merged_at, created_at, updated_at]
              properties:
                projects: {type: array, items: {type: string}, description: The projects whose issues it can name}
                names: {type: array, items: {type: string}}
                title: {type: string}
                url: {type: string}
                branch: {type: string}
                base: {type: string}
                author: {type: string}
                merged: {type: boolean}
                closed: {type: boolean}
                merged_at: {type: [string, 'null']}
                created_at: {type: string}
                updated_at: {type: string}
      responses:
        '204': {description: Kept}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/presets:
    get:
      summary: The orrery's presets, for sessions on any project, by name
