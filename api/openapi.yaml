            application/json:
              schema:
                type: object
                required: [repo, pulls, recorded]
                properties:
                  repo: {type: [object, 'null'], properties: {polled_at: {type: string}, token: {type: boolean}, error: {type: [string, 'null']}, history_page: {type: integer}}}
                  pulls: {type: array, items: {type: object, description: 'A `pull_states` row but its repo, `names` and `told` as lists and its flags as booleans'}}
                  recorded: {type: array, items: {type: object, properties: {number: {type: integer}, updated_at: {type: string}, branch: {type: string}, url: {type: string}, state: {type: string}}}}
    put:
      x-served: false
      summary: 'A repo''s poll: each PR as read, those it missed kept as closed, and the repo as polled'
      description: >-
