[package]
name = "orrery-api"
# Released with orrery, not on its own: its version is web/package.json's.
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false
description = "orrery's API in Rust, taking over the Nuxt server's data routes domain by domain (ORR-923)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
unicode-normalization = "0.1"
getrandom = "0.2"
base64 = "0.22"
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false }
# Logging in through an OIDC provider (ORR-928): its discovery, token endpoint and keys over https.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
url = "2"

[dev-dependencies]
# The tests send requests through the router (`oneshot`, ORR-1053).
tower = { version = "0.5", features = ["util"] }

# Proc macros (sqlx's) left unstripped: a release build strips them by default, and macOS's dyld then refuses the
# stripped dylib ("mis-aligned LINKEDIT string pool"), failing the build (ORR-1029). Only build-time code, so the
# binary is as it was.
[profile.release.build-override]
strip = "none"
